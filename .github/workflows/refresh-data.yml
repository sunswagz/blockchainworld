name: Cập nhật số liệu

# Nhịp của nhà máy. Mỗi lượt: hỏi sổ đăng ký xem node nào đến hạn,
# chạy đúng những node đó, ghi kết quả vào sổ, rồi commit.
#
# ── CRON Ở ĐÂY LÀ TRẦN, KHÔNG PHẢI NHỊP ───────────────────────────
# Trước đây cron QUYẾT node nào chạy lúc nào, nên đổi nhịp một cung
# là sửa YAML — và nhịp thật thì nằm rải ở ba chỗ (cron ở đây, thứ
# tự các bước, ngưỡng "bao lâu là cũ" trong scripts/tuoi-du-lieu.mjs)
# mà không có gì bắt ba chỗ đó khớp nhau.
#
# Giờ nhịp nằm ở NODE trong scripts/nha-may.mjs, một chỗ. Cron chỉ
# nói "cứ 3 giờ ngó một lần xem có gì đến hạn không". Node nhịp 24
# giờ vẫn chỉ chạy 1 lượt/ngày dù workflow thức dậy 8 lần — bước
# "Lập kế hoạch" bên dưới lọc.
#
# Hệ quả: đổi nhịp một cung = sửa một con số trong nha-may.mjs.
# Không đụng file này. Muốn nhịp mịn hơn 6 giờ thì mới sửa cron.

on:
  schedule:
    # ── VÌ SAO TÁM MỐC CHỨ KHÔNG PHẢI BỐN ─────────────────────────
    # Cron ở đây là TRẦN, không phải nhịp — thêm mốc KHÔNG làm node
    # nào chạy dày hơn, vì `den-han` vẫn chặn theo `nhip` của từng
    # node. Thêm mốc chỉ cho nhà máy thêm cơ hội thức dậy.
    #
    # Cần thêm cơ hội vì GitHub đang bỏ bớt lượt của ta. Đo ngày
    # 28/08 trên 56 lượt theo lịch:
    #
    #   14/08 → 26/08   ĐÚNG 4 lượt/ngày, mười ba ngày liền
    #   26/08 20:05 →   còn 2 lượt/ngày, cách nhau 12–13 giờ
    #
    # Không phải hai lượt chồng nhau: lượt dài nhất 38 phút. Thứ đổi
    # là ĐỘ TRỄ so với giờ cron — trước 35 phút đến 1,6 giờ, sau
    # 3,6 đến 5,2 giờ. Trễ quá 6 giờ thì mốc kế bị bỏ hẳn, nên cứ
    # hai lượt mất một.
    #
    # Mốc 26/08 20:05 chính là lượt 38 phút đầu tiên, đúng lúc các
    # node tiến hoá lên. Xưởng nặng lên thì GitHub giãn lịch ra.
    #
    # Tám mốc cách nhau 3 giờ: trễ tới 3 giờ vẫn không mất mốc nào,
    # và trễ 5 giờ thì mất một trong ba thay vì một trong hai.
    #
    # Giá phải trả gần bằng không, và đây là số ĐO chứ không phải ước:
    # lượt không có node nào đến hạn chạy hết 0,8 phút (đo lượt
    # 20/08 07:09). Bốn mốc thêm = khoảng 4 phút runner mỗi ngày,
    # trên kho công khai thì miễn phí.
    #
    # Lệch 17 phút để tránh giờ tròn — lúc đó hàng đợi GitHub đông
    # nhất và độ trễ tệ nhất.
    - cron: "17 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:
    inputs:
      ep:
        description: "Ép chạy mọi node, bỏ qua kiểm đến hạn"
        type: boolean
        default: false

# Workflow con KHÔNG được có quyền cao hơn workflow gọi nó — quyền khai
# ở đây là trần cho cả deploy-pages.yml bên dưới. Thiếu pages/id-token
# thì GitHub chặn ngay từ lúc khởi động (startup_failure), không có log
# nào trong job để mà lần ra.
permissions:
  contents: write
  pages: write
  id-token: write
  # Để bước "Mở việc nếu có node ốm" gọi được `gh issue`. Thiếu quyền
  # này thì `gh` trả 403 — mà bước đó continue-on-error, nên nó hỏng
  # im lặng và cảnh báo không bao giờ tới ai.
  issues: write

# Nhóm giữ nguyên tên dù scan-observatory.yml đã xoá (15/08) và giờ
# chỉ còn một workflow ghi vào main. Vì sao không bỏ: hai lượt của
# CHÍNH workflow này vẫn chồng nhau được — cron :17 gặp một lượt bấm
# tay, hoặc một lượt Tàng Thư Các 532 giây còn chưa xong. Hai lượt
# cùng ghi factory/state.json rồi cùng push là mất trắng một lượt.
concurrency:
  group: nha-may-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 10 phút là quá chật kể từ khi Tàng Thư Các lên 66 kho. Bước đó
    # dao động rất mạnh (151s, 309s, rồi 532s) vì nó lùi giờ chờ mỗi
    # lần chạm hạn mức GitHub. Lần 14/08 07:52 job bị cắt đúng mốc
    # 10,3 phút — mà job bị cắt thì BƯỚC COMMIT KHÔNG CHẠY, nên cả
    # Kinh Thành lẫn Đô Sát Viện cũng mất luôn lượt cập nhật đó dù
    # chúng đã lấy số xong từ phút đầu.
    # 40 → 70 khi bản quét Đài Quan Trắc nhập vào vòng này (15/08).
    # Nó mang theo 15 phút riêng, và trước đó nó có hẳn một job 20
    # phút của mình. Cộng lại xem ở khối "trần bước" bên dưới.
    # 80 → 130 (20/08). Tổng trần các BƯỚC đã là 115 phút sau khi Thái
    # Bộc Tự thêm ba node và Hộ Bộ thêm vòng tiến hoá, trong khi khối
    # ghi chú bên dưới vẫn cộng ra 75 — hai lần thêm cung liên tiếp đều
    # quên cộng lại. Lúc đó trần bước đã thành trang trí đúng như chính
    # dòng cảnh báo ở đó nói.
    #
    # Đừng cộng tay nữa, nó sai hai lần rồi. Đếm bằng máy:
    #   grep -E "^        timeout-minutes:" .github/workflows/refresh-data.yml \
    #     | awk '{s+=$2} END {print s}'
    #
    # 130 → 180 (02/09). `npm run kiem` đòi trần job ≥ 3 lần lượt chạy
    # THẬT xấu nhất, và lượt ấy đo được 43,8 phút — tức cần ≥ 132. Trần
    # 130 đã hụt 2 phút TRƯỚC khi tôi chạm vào, và mở khoá vòng tiến hoá
    # Đài Quan Trắc (bước model 15 phút, trước đây bị bỏ qua khi phiếu
    # đầy) làm nó hụt thêm.
    #
    # Vì sao nâng chứ không giãn nhịp: repo công khai nên phút Actions
    # miễn phí, và mỗi BƯỚC đã có trần riêng (cao nhất 15 phút) nên một
    # bước treo không thể ăn hết 180 phút — trần job chỉ là lưới cuối.
    # Giãn nhịp thì ngược lại, nó đổi thứ người dùng thấy được.
    timeout-minutes: 180
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    # Cấp job, để `if` của step đọc được — khai trong chính step thì không.
    env:
      PINATA_JWT: ${{ secrets.PINATA_JWT }}
      CCOT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    steps:
      # fetch-depth 0, không phải mặc định 1. Bước commit cuối job có thể
      # phải rebase lên main khi bị chen giữa chừng, mà clone sâu một
      # commit thì không có nền chung để rebase — lượt #12 (15/08) chết
      # đúng chỗ đó, trong 2 giây, sau khi push bị từ chối.
      # Đắt thêm vài giây mỗi lượt, đổi lấy bước cuối không mất trắng.
      #
      # @v5 chứ không @v4: v4 chạy trên node20, mà GitHub đã báo deprecated
      # và đang ép nó chạy tạm trên node24. v5 là major ĐẦU TIÊN khai
      # `using: node24` — tra thẳng `action.yml` của từng tag chứ không
      # đoán theo ghi chú phát hành. Cố ý KHÔNG nhảy lên v7 (bản mới nhất
      # lúc nâng): v5→v7 mang theo thay đổi phá vỡ về `pull_request_target`
      # mà repo này không dùng, nên nhảy xa chỉ thêm rủi ro không đổi lấy gì.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      # ── M05 · Máy lập kế hoạch ──────────────────────────────────
      # Một lời gọi, trả về danh sách node đến hạn dạng ",a,b,c," —
      # có phẩy hai đầu để `contains()` không khớp nhầm tiền tố.
      - name: Lập kế hoạch — node nào đến hạn
        id: kehoach
        timeout-minutes: 2
        env:
          NHA_MAY_EP: ${{ inputs.ep && '1' || '' }}
        run: |
          han=$(node scripts/nha-may.mjs den-han)
          echo "han=$han" >> "$GITHUB_OUTPUT"
          echo "Đến hạn: $han"
          node scripts/nha-may.mjs bang

      # ── M02 · Máy phân loại: vì sao node ngã ────────────────────
      # Mỗi bước chạy đổ output qua `tee` vào $RUNNER_TEMP, rồi bước
      # ghi sổ đưa file đó cho `--log`. nha-may.mjs khớp chuỗi để
      # phân bốn bệnh: hạn mức · khoá sai · nguồn ngã · lỗi mã.
      #
      # Vì sao đáng làm: sổ chỉ ghi "loi" thì mọi cái ngã trông giống
      # nhau, mà bốn bệnh đó chữa ở bốn chỗ khác hẳn — chờ, xin PAT,
      # thay secret, hay sửa code. "Tàng Thư Các đỏ" không nói được
      # gì; "Tàng Thư Các chạm hạn mức" nói thẳng phải làm gì.
      #
      # `tee` giữ nguyên mã thoát vì shell mặc định của Actions có
      # `pipefail`. Không có nó thì mọi bước đều thành công vĩnh viễn.
      #
      # ── Từng node: một bước CHẠY + một bước GHI SỔ ──────────────
      # Vì sao tách đôi thay vì `cmd || ghi loi` trong cùng một bước:
      # bước bị CẮT vì hết giờ thì mọi lệnh sau nó trong cùng bước
      # cũng chết theo, nên node treo sẽ không để lại dấu vết nào và
      # trên Bảng vận hành nó hiện là "chưa chạy" thay vì "ngã".
      # `if: always()` ở bước ghi thì sống sót qua cả trường hợp đó.
      #
      # Luật cũ vẫn giữ: mỗi bước continue-on-error PHẢI có
      # timeout-minutes. Cờ đó chỉ nuốt được bước NGÃ; bước TREO thì
      # nó bất lực, và hết giờ ở cấp job là huỷ cả job.
      #
      # Ngân sách thời gian của một lượt KHÔNG cộng tay ở đây nữa.
      # Chỗ này từng là một khối cộng trần bước, và nó đã lệch hai
      # lần: 20/08 quên cộng cung mới (tổng thật 72 > trần job 70),
      # rồi lệch tiếp cho tới khi khai 75 trong khi cộng thật 236 và
      # trần job đã là 130. Một con số phải cộng tay mỗi lần thêm
      # bước thì sớm muộn cũng thành trang trí.
      #
      # Giờ `npm run kiem` canh việc đó bằng giây chạy THẬT trong
      # factory/state.json, và báo lỗi nếu khối cộng tay sống lại.
      # Nó cũng bắt bước có việc mà quên timeout-minutes, và kêu
      # trước khi một node kịp chạy sát van của chính nó.

      - name: Lấy số mới — Kinh Thành
        id: n-kinh-thanh
        if: contains(steps.kehoach.outputs.han, ',kinh-thanh,')
        continue-on-error: true
        timeout-minutes: 5
        run: |
          t0=$(date +%s)
          node scripts/build-live.mjs 2>&1 | tee "$RUNNER_TEMP/kinh-thanh.log"
          echo "giay=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
      - name: Ghi sổ · kinh-thanh
        if: always() && steps.n-kinh-thanh.outcome != 'skipped'
        env:
          KET: ${{ steps.n-kinh-thanh.outcome == 'success' && 'ok' || 'loi' }}
          GIAY: ${{ steps.n-kinh-thanh.outputs.giay }}
        run: node scripts/nha-may.mjs ghi kinh-thanh "$KET" ${GIAY:+--giay $GIAY} --log "$RUNNER_TEMP/kinh-thanh.log"

      - name: Lấy bảng xét — Đô Sát Viện
        id: n-do-sat-vien
        if: contains(steps.kehoach.outputs.han, ',do-sat-vien,')
        continue-on-error: true
        timeout-minutes: 3
        run: |
          t0=$(date +%s)
          node scripts/build-l2beat.mjs 2>&1 | tee "$RUNNER_TEMP/do-sat-vien.log"
          echo "giay=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
      - name: Ghi sổ · do-sat-vien
        if: always() && steps.n-do-sat-vien.outcome != 'skipped'
        env:
          KET: ${{ steps.n-do-sat-vien.outcome == 'success' && 'ok' || 'loi' }}
          GIAY: ${{ steps.n-do-sat-vien.outputs.giay }}
        run: node scripts/nha-may.mjs ghi do-sat-vien "$KET" ${GIAY:+--giay $GIAY} --log "$RUNNER_TEMP/do-sat-vien.log"

      # Đồ nghề Công Bộ. Hay ngã, và vì lý do mạnh hơn L2BEAT: kính
      # lúp hồ sơ lấy từ fe-stag — host STAGING của L2BEAT, tắt lúc
      # nào không báo. Hỏng thì build tự giữ bản cũ.
      - name: Lấy đồ nghề — Công Bộ
        id: n-cong-bo
        if: contains(steps.kehoach.outputs.han, ',cong-bo,')
        continue-on-error: true
        timeout-minutes: 2
        run: |
          t0=$(date +%s)
          node scripts/build-congbo.mjs 2>&1 | tee "$RUNNER_TEMP/cong-bo.log"
          echo "giay=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
      - name: Ghi sổ · cong-bo
        if: always() && steps.n-cong-bo.outcome != 'skipped'
        env:
          KET: ${{ steps.n-cong-bo.outcome == 'success' && 'ok' || 'loi' }}
          GIAY: ${{ steps.n-cong-bo.outputs.giay }}
        run: node scripts/nha-may.mjs ghi cong-bo "$KET" ${GIAY:+--giay $GIAY} --log "$RUNNER_TEMP/cong-bo.log"

      # Dòng tiền Hộ Bộ. Mười một đường DefiLlama công khai, không khoá
      # nào, không gọi AI. Đo thật ~6 giây; trần 5 phút vì hai đường
      # nặng nhất (/protocols 8,5 MB và /yields 10,7 MB) tải chậm hẳn
      # khi DefiLlama bận, và vì nó còn 20 lời gọi lịch sử nối đuôi.
      #
      # Script tự giữ bản cũ khi nguồn ngã: bốn nguồn LÕI thiếu thì nó
      # thoát 1 mà KHÔNG ghi gì. Bảng dòng tiền trống bị đọc thành
      # "thị trường không có gì" — tệ hơn hẳn một bảng cũ có ghi ngày.
      - name: Lấy dòng tiền — Hộ Bộ
        id: n-ho-bo
        if: contains(steps.kehoach.outputs.han, ',ho-bo,')
        continue-on-error: true
        timeout-minutes: 5
        run: |
          t0=$(date +%s)
          node scripts/build-hobu.mjs 2>&1 | tee "$RUNNER_TEMP/ho-bo.log"
          echo "giay=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
      - name: Ghi sổ · ho-bo
        if: always() && steps.n-ho-bo.outcome != 'skipped'
        env:
          KET: ${{ steps.n-ho-bo.outcome == 'success' && 'ok' || 'loi' }}
          GIAY: ${{ steps.n-ho-bo.outputs.giay }}
        run: node scripts/nha-may.mjs ghi ho-bo "$KET" ${GIAY:+--giay $GIAY} --log "$RUNNER_TEMP/ho-bo.log"

      # Đoàn tàu Thái Bộc Tự. Ba đường DefiLlama, trong đó /protocols là
      # đường nặng nhất repo này gọi (hơn 8.000 bản ghi) — nhưng chỉ một
      # lời gọi, không nối đuôi như Hộ Bộ, nên 5 phút là rộng.
      #
      # Cùng luật giữ bản cũ: hai nguồn LÕI thiếu thì thoát 1 mà KHÔNG
      # ghi gì. Bảng khớp nối trống bị đọc thành "không còn khớp nào phụ
      # thuộc", đúng ngược với điều cung này tồn tại để nói.
      - name: Lấy đoàn tàu — Thái Bộc Tự
        id: n-thai-boc-tu
        if: contains(steps.kehoach.outputs.han, ',thai-boc-tu,')
        continue-on-error: true
        timeout-minutes: 5
        run: |
          t0=$(date +%s)
          node scripts/build-thaiboc.mjs 2>&1 | tee "$RUNNER_TEMP/thai-boc-tu.log"
          echo "giay=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
      - name: Ghi sổ · thai-boc-tu
        if: always() && steps.n-thai-boc-tu.outcome != 'skipped'
        env:
          KET: ${{ steps.n-thai-boc-tu.outcome == 'success' && 'ok' || 'loi' }}
          GIAY: ${{ steps.n-thai-boc-tu.outputs.giay }}
        run: node scripts/nha-may.mjs ghi thai-boc-tu "$KET" ${GIAY:+--giay $GIAY} --log "$RUNNER_TEMP/thai-boc-tu.log"

      # Công trường Thái Bộc Tự — hỏi GitHub, không hỏi DefiLlama.
      #
      # GITHUB_TOKEN là token Actions TỰ CẤP cho mỗi lượt chạy, hết hạn
      # khi lượt kết thúc. Không phải secret ai đó phải thêm vào repo, và
      # không tính tiền theo token như khoá model. Có nó thì 5.000
      # lượt/giờ thay vì 60 — script tốn ~32 lượt nên không có token vẫn
      # chạy được, chỉ mong manh hơn.
      #
      # Trần 4 phút: 32 lời gọi nối đuôi, mỗi cái timeout 45 giây, nhưng
      # thực đo dưới 30 giây cho cả lượt.
      - name: Lấy công trường — Thái Bộc Tự
        id: n-thai-boc-tu-ct
        if: contains(steps.kehoach.outputs.han, ',thai-boc-tu-cong-truong,')
        continue-on-error: true
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          t0=$(date +%s)
          node scripts/build-congtruong.mjs 2>&1 | tee "$RUNNER_TEMP/thai-boc-tu-ct.log"
          echo "giay=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
      - name: Ghi sổ · thai-boc-tu-cong-truong
        if: always() && steps.n-thai-boc-tu-ct.outcome != 'skipped'
        env:
          KET: ${{ steps.n-thai-boc-tu-ct.outcome == 'success' && 'ok' || 'loi' }}
          GIAY: ${{ steps.n-thai-boc-tu-ct.outputs.giay }}
        run: node scripts/nha-may.mjs ghi thai-boc-tu-cong-truong "$KET" ${GIAY:+--giay $GIAY} --log "$RUNNER_TEMP/thai-boc-tu-ct.log"

      # Tin tức Thái Bộc Tự — sáu nguồn RSS công khai, đọc song song.
      #
      # Trần 3 phút: sáu lời gọi CHẠY CÙNG LÚC (Promise.all), mỗi cái
      # timeout 45 giây, nên xấu nhất vẫn dưới 1 phút. Một toà soạn ngã
      # thì chỉ mất bài của nguồn đó; TẤT CẢ ngã thì script thoát 1 và
      # giữ bản cũ — bảng tin trống bị đọc thành "thế giới không có tin".
      - name: Lấy tin tức — Thái Bộc Tự
        id: n-thai-boc-tu-tin
        if: contains(steps.kehoach.outputs.han, ',thai-boc-tu-tin,')
        continue-on-error: true
        timeout-minutes: 3
        run: |
          t0=$(date +%s)
          node scripts/build-tintuc.mjs 2>&1 | tee "$RUNNER_TEMP/thai-boc-tu-tin.log"
          echo "giay=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
      - name: Ghi sổ · thai-boc-tu-tin
        if: always() && steps.n-thai-boc-tu-tin.outcome != 'skipped'
        env:
          KET: ${{ steps.n-thai-boc-tu-tin.outcome == 'success' && 'ok' || 'loi' }}
          GIAY: ${{ steps.n-thai-boc-tu-tin.outputs.giay }}
        run: node scripts/nha-may.mjs ghi thai-boc-tu-tin "$KET" ${GIAY:+--giay $GIAY} --log "$RUNNER_TEMP/thai-boc-tu-tin.log"

      # Kho skill Tàng Thư Các. Trần riêng cho bước này, thấp hơn trần
      # job: chạm trần thì chỉ mình nó ngã, commit vẫn chạy. Script chỉ
      # ghi file ở cuối, nên bị cắt giữa chừng là file cũ còn nguyên —
      # không có bản dở dang nào bị commit.
      #
      # Dùng GH_PAT nếu có, không thì lùi về GITHUB_TOKEN. Chưa đặt
      # secret thì `||` trả về GITHUB_TOKEN và mọi thứ chạy y như cũ.
      #
      # Nói cho đúng về lợi ích, vì chỗ này dễ ghi sai:
      # PAT KHÔNG phải thứ mở khoá việc quét đủ 66 kho. Mỗi kho chỉ
      # tốn ĐÚNG MỘT lượt API (đo thật: 31→30→29→28→27) vì nội dung
      # skill lấy qua raw.githubusercontent.com, vốn không tính vào
      # hạn mức. Nên 1.000 lượt/giờ của GITHUB_TOKEN đã thừa sức.
      # Thứ chặn ở 40 kho là một con số viết cứng trong script, nay
      # đã bỏ — script tự hỏi /rate_limit rồi đặt ngân sách theo
      # hạn mức còn lại thật.
      #
      # Vậy PAT còn để làm gì: GITHUB_TOKEN có 1.000 lượt/giờ dùng
      # CHUNG cho mọi workflow của repo — hôm 14/08 repo này chạy 42
      # lượt trong ngày. PAT tách ngân sách riêng 5.000/giờ, nên là
      # khoảng đệm phòng khi repo bận, không phải điều kiện cần.
      # Token chỉ cần quyền ĐỌC KHO CÔNG KHAI, không cần quyền ghi.
      - name: Lấy kho skill — Tàng Thư Các
        id: n-tang-thu-cac
        if: contains(steps.kehoach.outputs.han, ',tang-thu-cac,')
        continue-on-error: true
        # 14 → 20 phút. Bước này PHÌNH THEO KHO: chú thích trong sổ
        # đăng ký ghi "có lượt 532 giây", lượt 29/08 đã là 684 — tức
        # 81% của van 14 phút, và kho vẫn đang lớn (3.696 → 3.697 kỹ
        # năng trong một ngày). Phép canh ngân sách trong `npm run
        # kiem` kêu trước khi nó nổ; đây là hành động theo tiếng kêu
        # đó, không phải đoán.
        #
        # Nới van chứ không siết nhịp: nhịp 6 giờ là thứ giữ kho tươi,
        # còn van chỉ là chỗ chặn một lượt treo. Van nổ ở đây nghĩa là
        # cả Tàng Thư Các đứng số liệu, mà bốn thứ khác đọc kho ấy —
        # kể cả vòng dò kho và phần chọn kỹ năng của mọi vòng tiến hoá.
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          t0=$(date +%s)
          node scripts/build-tangthu.mjs 2>&1 | tee "$RUNNER_TEMP/tang-thu-cac.log"
          echo "giay=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
      - name: Ghi sổ · tang-thu-cac
        if: always() && steps.n-tang-thu-cac.outcome != 'skipped'
        env:
          KET: ${{ steps.n-tang-thu-cac.outcome == 'success' && 'ok' || 'loi' }}
          GIAY: ${{ steps.n-tang-thu-cac.outputs.giay }}
        run: node scripts/nha-may.mjs ghi tang-thu-cac "$KET" ${GIAY:+--giay $GIAY} --log "$RUNNER_TEMP/tang-thu-cac.log"

      # ── M11 · Kho dụng cụ ───────────────────────────────────────
      # Tàng Thư Các là CATALOGUE: nó biết 3.656 skill nằm ở đâu, cái
      # nào nhiều sao, thuộc nhóm gì — rồi thôi. Repo không có
      # `.claude/skills/` nên không phiên nào gọi được cái nào. Quét
      # được mà không tới được tay ai: đúng cái ống đứt vừa nối cho
      # ba cỗ máy đo ở 4b8e9e4, lặp lại ở một chỗ khác.
      #
      # Bước này biến catalogue thành kệ dụng cụ thật. Chạy SAU
      # tang-thu-cac vì nó đọc chính data.js mà node kia vừa ghi.
      #
      # Skill là CHỈ DẪN model làm theo, không phải dữ liệu để đọc.
      # Nên script chỉ lấy SKILL.md — không lấy script chạy được —
      # có sàn sao, có trần mỗi kho, và ghi sha256 vào
      # factory/skills.json để đổi nội dung là thấy ngay ở diff.
      - name: Nhập skill vào kệ
        id: n-nhap-skill
        if: contains(steps.kehoach.outputs.han, ',nhap-skill,')
        continue-on-error: true
        timeout-minutes: 3
        run: |
          t0=$(date +%s)
          node scripts/nhap-skill.mjs 2>&1 | tee "$RUNNER_TEMP/nhap-skill.log"
          echo "giay=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
      - name: Ghi sổ · nhap-skill
        if: always() && steps.n-nhap-skill.outcome != 'skipped'
        env:
          KET: ${{ steps.n-nhap-skill.outcome == 'success' && 'ok' || 'loi' }}
          GIAY: ${{ steps.n-nhap-skill.outputs.giay }}
        run: node scripts/nha-may.mjs ghi nhap-skill "$KET" ${GIAY:+--giay $GIAY} --log "$RUNNER_TEMP/nhap-skill.log"

      # Bảng cảnh báo sớm Đài Quan Trắc. Ba nguồn miễn phí không cần
      # khoá (Yahoo Finance, open.er-api, Federal Register), so ngưỡng rồi
      # tự đặt đèn xanh/vàng/đỏ. KHÔNG gọi AI — xem phần đầu
      # scripts/build-quantrac.mjs để biết vì sao đó là lựa chọn thiết
      # kế chứ không chỉ là chuyện tiền.
      #
      # Trần 3 phút: xấu nhất là 4 nguồn × (3 lần thử × 30s + nghỉ),
      # nhưng mỗi nguồn hỏng độc lập nên thực tế không bao giờ chạm.
      - name: Đo bảng cảnh báo — Quan Trắc
        id: n-quan-trac-do
        if: contains(steps.kehoach.outputs.han, ',quan-trac-do,')
        continue-on-error: true
        timeout-minutes: 3
        run: |
          t0=$(date +%s)
          node scripts/build-quantrac.mjs 2>&1 | tee "$RUNNER_TEMP/quan-trac-do.log"
          echo "giay=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
      - name: Ghi sổ · quan-trac-do
        if: always() && steps.n-quan-trac-do.outcome != 'skipped'
        env:
          KET: ${{ steps.n-quan-trac-do.outcome == 'success' && 'ok' || 'loi' }}
          GIAY: ${{ steps.n-quan-trac-do.outputs.giay }}
        run: node scripts/nha-may.mjs ghi quan-trac-do "$KET" ${GIAY:+--giay $GIAY} --log "$RUNNER_TEMP/quan-trac-do.log"

      # Đóng dấu bản số liệu lên IPFS trước khi commit.
      # Tự bỏ qua nếu sha256 trùng bản trước, nên không tạo rác.
      #
      # `if:` chỉ đỡ được trường hợp THIẾU secret. Secret CÓ mà sai thì
      # Pinata trả 4xx, pin-snapshot.mjs thoát 1, và trước khi có
      # continue-on-error thì cả job chết ngay tại đây — commit không
      # chạy, site đứng im. Đã xảy ra ba lượt liền 13–14/08, mỗi lượt
      # ngã trong chưa tới 1 giây, và cái mất không phải con dấu mà là
      # toàn bộ số liệu bốn cung đã lấy xong nằm chờ commit.
      - name: Đóng dấu bản số liệu
        id: n-dong-dau
        if: env.PINATA_JWT != '' && contains(steps.kehoach.outputs.han, ',dong-dau,')
        continue-on-error: true
        timeout-minutes: 2
        run: |
          t0=$(date +%s)
          node scripts/pin-snapshot.mjs 2>&1 | tee "$RUNNER_TEMP/dong-dau.log"
          echo "giay=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
      - name: Ghi sổ · dong-dau
        if: always() && steps.n-dong-dau.outcome != 'skipped'
        env:
          KET: ${{ steps.n-dong-dau.outcome == 'success' && 'ok' || 'loi' }}
          GIAY: ${{ steps.n-dong-dau.outputs.giay }}
        run: node scripts/nha-may.mjs ghi dong-dau "$KET" ${GIAY:+--giay $GIAY} --log "$RUNNER_TEMP/dong-dau.log"

      # ── M17 · Phòng điều khiển ──────────────────────────────────
      # Chiếu sổ sang thứ trình duyệt đọc được. `always()` vì bảng phải
      # hiện được cả những lượt mọi node đều ngã — đó chính là lượt
      # người ta cần nhìn bảng nhất.
      # ── M07 · Quét chiến trường ─────────────────────────────────
      # Việc DUY NHẤT trong xưởng thật sự cần phán đoán: đọc tin bảy
      # ngày rồi viết một câu tiếng Việt kèm phân loại xanh/vàng/đỏ.
      #
      # Trước đây nó nằm ở workflow riêng và trả bằng ANTHROPIC_API_KEY
      # — 610K token, 4,30 USD cho ba lượt, tức ~170 USD/tháng ở nhịp
      # 4 lượt/ngày. Lịch bị tắt sáng 14/08 vì vậy, và cung Đài Quan
      # Trắc sống bằng bản quét cũ suốt từ đó.
      #
      # Nay nó về đây, trong cùng một vòng, và trả bằng QUOTA GÓI.
      # Không còn khoá API nào trong repo này.
      #
      # BA BƯỚC, KHÔNG PHẢI MỘT — và đó là chỗ đáng chú ý nhất:
      #   1. ra đề  — script đọc THEATERS trong data.js của app
      #   2. quét   — model tìm tin, ghi JSON THÔ
      #   3. dựng   — script kiểm JSON rồi mới dựng scan.js
      # Cho model ghi thẳng scan.js thì một lỗi cú pháp của nó là một
      # trang trắng cho người xem. Ghi JSON rồi ta dựng JS: hỏng thì
      # hỏng ở chỗ đọc được, và bước 3 chặn trước khi đè bản cũ.
      #
      # Vẫn HAIKU chứ không phải Opus, và lý do không đổi dù giờ trả
      # bằng quota: khối lượng ở đây KHÔNG CHẶN ĐƯỢC — WebSearch kéo
      # nguyên nội dung trang vào ngữ cảnh, nhân sáu chiến trường.
      # Chỗ khối lượng phình thì chọn model rẻ; chỗ khối lượng cố
      # định (bao-cao) mới dùng Opus. Xem bảng trong CLAUDE.md.
      # ── BẤM GIỜ QUANH BƯỚC MODEL ────────────────────────────────
      # Hai node gọi model là hai chỗ tốn quota nhất trong xưởng, và
      # cho tới nay là hai chỗ DUY NHẤT sổ không đo được. `giay` của
      # dai-quan-trac ghi 0 — đó là giây của bước DỰNG, không phải
      # bước QUÉT; `bao-cao` thì ghi null. Nghĩa là đúng hai bước cần
      # theo dõi nhất lại không có số liệu nào để mà theo dõi.
      #
      # Nguyên nhân kỹ thuật: chỉ bước `run:` mới chạy được
      # `t0=$(date +%s)`. Bước `uses:` không có chỗ nào nhét shell vào,
      # nên giờ phải bấm ở hai bước `run:` kẹp hai bên.
      #
      # Các bước bấm giờ CỐ Ý không có `timeout-minutes`: luật "mỗi
      # bước continue-on-error phải có trần" chỉ nói về bước
      # continue-on-error, mà `date` thì không ngã và không treo được.
      # Thêm trần cho chúng là ăn mất 4 phút đệm của trần job để đổi
      # lấy một thứ không bao giờ dùng tới.
      - name: Ra đề cho bản quét
        id: n-de-bai
        if: env.CCOT != '' && contains(steps.kehoach.outputs.han, ',dai-quan-trac,')
        continue-on-error: true
        timeout-minutes: 2
        run: |
          echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"
          node scripts/build-scan.mjs --de-bai

      - name: Bấm giờ · trước khi quét
        id: gio-quet-0
        if: steps.n-de-bai.outcome == 'success'
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Quét chiến trường (Claude Code)
        id: n-quet
        if: steps.n-de-bai.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-haiku-4-5
            --max-turns 55
            --allowedTools "Read,Write,WebSearch,WebFetch"
          prompt: |
            Đọc dai-quan-trac/assets/data/de-bai.json. Trong đó là danh
            sách chiến trường của HAI NƯỚC, mỗi cái có `id`, `nuoc`,
            `ten`, `tim` và `boi_canh`.

            Với TỪNG chiến trường, dùng WebSearch tìm diễn biến MỚI
            NHẤT trong 7 ngày gần đây theo `tim`.

            QUAN TRỌNG — HAI NƯỚC HỎI HAI CÂU KHÁC NHAU. Trường
            `boi_canh` của từng chiến trường nói rõ câu nào, và
            `tac_dong` phải viết theo ĐÚNG bối cảnh đó:
            · Việt Nam  — cú sốc truyền tới giá cả, tỷ giá, việc làm.
            · Trung Quốc — cú sốc kinh tế KHÔNG trực tiếp đe doạ chế
              độ; nó phải đi qua thu ngân sách và khả năng nuôi bộ máy
              rồi mới chạm tới quyền lực. Viết `tac_dong` của Trung
              Quốc theo khuôn Việt Nam là hỏng đúng phần cốt lõi.

            Rồi ghi đúng MỘT file, dai-quan-trac/assets/data/quet.json,
            đúng dạng này:

            {"model":"claude-haiku-4-5","chien_truong":[
              {"id":"<đúng id trong đề bài>",
               "muc":"g|y|r",
               "tom_tat":"1 câu tiếng Việt",
               "tin_hieu":[
                 {"tieu_de":"câu tiếng Việt mô tả sự kiện CÓ THẬT",
                  "ngay":"YYYY-MM-DD",
                  "nguon":"tên hãng tin",
                  "tac_dong":"1 câu: sự kiện này truyền tới ĐÍCH trong boi_canh qua đường nào"}]}]}

            Luật:
            · muc: g bình thường · y căng thẳng đáng chú ý · r gián đoạn nghiêm trọng.
            · Tối đa 4 tín hiệu mỗi chiến trường. CHỈ dùng sự kiện thật
              tìm được. Không tìm được gì thì để "tin_hieu": [].
            · `id` phải lấy NGUYÊN VĂN từ đề bài, KỂ CẢ tiền tố nước
              ("vn:hormuz", "tq:nangluong"). Bỏ tiền tố là tín hiệu bị
              loại — `nga` là chiến trường của CẢ HAI nước nên không
              đoán hộ được, và đoán sai là đổ tin vào bảng sai nước.
            · Tìm gọn: mỗi chiến trường vài lượt tìm là đủ, đừng đào sâu.
            · Chỉ ghi đúng file quet.json. Không sửa file nào khác,
              không chạy lệnh nào.

            QUAN TRỌNG — việc này chỉ coi là xong khi FILE quet.json ĐÃ
            TỒN TẠI trên đĩa. Đừng bao giờ kết thúc mà chưa ghi nó.

            · Ghi file NGAY sau chiến trường đầu tiên, rồi ghi đè bổ
              sung dần. Như vậy hết giờ giữa chừng vẫn còn kết quả một
              phần, thay vì mất trắng.
            · WebSearch hỏng hoặc không dùng được thì VẪN ghi file: đủ
              MỌI chiến trường trong đề bài, `"tin_hieu": []`, và `tom_tat` ghi rõ
              lý do không tìm được. Một file nói "không tìm được" có
              ích hơn hẳn không có file nào.

      # `always()` chứ không phải `success()`: bước quét NGÃ cũng tốn
      # quota, và "ngã sau 14 phút" với "ngã sau 3 giây" là hai bệnh
      # khác hẳn nhau. Bỏ qua lúc ngã là mù đúng lúc cần thấy nhất.
      - name: Bấm giờ · sau khi quét
        id: gio-quet-1
        if: always() && steps.gio-quet-0.outcome == 'success'
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Lượt #15: bước quét trên BÁO THÀNH CÔNG sau 112 giây, nhưng
      # quet.json không hề được ghi, nên bước dựng ngã trong 0 giây và
      # scan.js đứng nguyên bản 13/08. Từ ngoài thì cả ba bước đều
      # xanh — đúng kiểu hỏng im lặng mà M15 sinh ra để chặn.
      #
      # Nên soi thẳng: model có ghi file không, file to bao nhiêu.
      # In ra annotation để đọc được mà không cần tải log.
      - name: Soi bản quét thô
        if: always() && steps.n-quet.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 1
        run: |
          Q=dai-quan-trac/assets/data/quet.json
          if [ ! -f "$Q" ]; then
            echo "::error::Bước quét xong mà KHÔNG ghi $Q. Thư mục có: $(ls -A dai-quan-trac/assets/data/ 2>/dev/null | tr '\n' ' ')"
            exit 0
          fi
          echo "::notice::quet.json $(wc -c < "$Q") byte · $(node -e "
            try{const q=require('./$Q');
              const c=(q.chien_truong||[]);
              console.log(c.length+' chiến trường, '+c.reduce((n,x)=>n+((x.tin_hieu||[]).length),0)+' tín hiệu');
            }catch(e){console.log('JSON hỏng: '+e.message.slice(0,80))}")"
          head -c 400 "$Q"

      - name: Dựng bản quét
        id: n-dai-quan-trac
        if: steps.n-quet.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          t0=$(date +%s)
          node scripts/build-scan.mjs 2>&1 | tee "$RUNNER_TEMP/dai-quan-trac.log"
          echo "giay=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
      # `giay` của node này giờ là giây của CẢ BA BƯỚC (ra đề → quét →
      # dựng), không phải của riêng bước dựng như trước. Đó mới là
      # thứ khớp với `lenh` khai trong sổ đăng ký.
      #
      # Phần tách nhỏ đi vào `chuThich`, vì `chieu` đã chiếu trường đó
      # sang Bảng vận hành — nên số hiện lên trang mà không phải thêm
      # một trường mới vào lược đồ sổ ghi (đụng vào đó là đụng
      # nha-may.mjs, file dùng chung).
      - name: Ghi sổ · dai-quan-trac
        if: always() && steps.n-de-bai.outcome != 'skipped'
        env:
          KET: ${{ steps.n-dai-quan-trac.outcome == 'success' && 'ok' || 'loi' }}
          T_DAU: ${{ steps.n-de-bai.outputs.t0 }}
          TQ0: ${{ steps.gio-quet-0.outputs.t }}
          TQ1: ${{ steps.gio-quet-1.outputs.t }}
          GIAY_DUNG: ${{ steps.n-dai-quan-trac.outputs.giay }}
        run: |
          TONG=""
          [ -n "$T_DAU" ] && TONG=$(( $(date +%s) - T_DAU ))
          QUET="?"
          [ -n "$TQ0" ] && [ -n "$TQ1" ] && QUET=$(( TQ1 - TQ0 ))
          node scripts/nha-may.mjs ghi dai-quan-trac "$KET" \
            ${TONG:+--giay $TONG} \
            --ghi "quét ${QUET}s · dựng ${GIAY_DUNG:-?}s · haiku-4-5" \
            --log "$RUNNER_TEMP/dai-quan-trac.log"

      # ── M08 · Dòng tin ──────────────────────────────────────────
      # Ba bước, cùng khuôn với bản quét. Bước 1 và 3 là script thuần
      # (RSS + kiểm), chỉ bước 2 gọi model.
      #
      # Van chi phí nằm ở MOI_CHU_THE trong build-dong-tin.mjs: 6 bài × 3
      # chủ thể. Model KHÔNG tìm web — tiêu đề, tóm tắt và ảnh đã nằm
      # sẵn trong đề bài, nên ngữ cảnh có trần cứng chứ không phình
      # theo số trang tìm được như bước quét.
      - name: Ra đề cho dòng tin
        id: n-tin-de
        if: env.CCOT != '' && contains(steps.kehoach.outputs.han, ',dong-tin,')
        continue-on-error: true
        timeout-minutes: 4
        run: |
          echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"
          node scripts/build-dong-tin.mjs --de-bai

      - name: Phân tích dòng tin (Claude Code)
        id: n-tin-ai
        if: steps.n-tin-de.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-haiku-4-5
            --max-turns 30
            --allowedTools "Read,Write"
          prompt: |
            Đọc dai-quan-trac/assets/data/tin-de-bai.json.

            Trong đó có `chuThe` — ba mục, mỗi mục gồm:
            · `id`, `ten`  — chủ thể (vn / tq / tk)
            · `hoi`        — CÂU HỎI riêng của chủ thể đó
            · `mach`       — danh sách mắt xích, mỗi cái có `id` và `t`
            · `bai`        — các bài báo: `tieu`, `mo`, `link`, `nguon`, `ngay`

            Với TỪNG bài của TỪNG chủ thể, viết một đoạn trả lời đúng
            câu `hoi` của chủ thể ấy, và chỉ ra bài đó chạm vào mắt
            xích nào trong `mach`.

            BA CHỦ THỂ HỎI BA CÂU KHÁC NHAU — đây là chỗ dễ hỏng nhất:
            · vn — cú sốc truyền tới giá cả, tỷ giá, tín dụng, việc làm.
            · tq — cú sốc kinh tế KHÔNG trực tiếp đe doạ chế độ; nó phải
              đi qua thu ngân sách và khả năng nuôi bộ máy rồi mới chạm
              tới quyền lực.
            · tk — KHÔNG hỏi về một nước. Hỏi bài này SIẾT hay NỚI khớp
              nối Việt–Trung, và khớp nối đó với Mỹ.

            Ghi đúng MỘT file, dai-quan-trac/assets/data/tin-phan-tich.json:

            {"chuThe":[
              {"id":"vn","phanTich":[
                {"link":"<NGUYÊN VĂN link trong đề bài>",
                 "mach":"<id mắt xích, lấy từ `mach` CỦA CHÍNH chủ thể này>",
                 "muc":"cao|vua|thap",
                 "anh":"2–3 câu tiếng Việt"}]}]}

            Luật, và mỗi luật vi phạm là MỤC ĐÓ BỊ LOẠI lúc dựng:
            · `link` phải trùng NGUYÊN VĂN một link trong đề bài. Đừng
              bình luận bài không có trong danh sách.
            · `mach` phải là id có trong `mach` CỦA ĐÚNG chủ thể đó. Ba
              chủ thể có ba bộ mắt xích khác nhau và VÀI ID TRÙNG TÊN
              nhau — lấy nhầm sang bộ của chủ thể khác là mục bị loại.
            · `muc` chỉ được là cao, vua, hoặc thap. Không dấu, không
              chữ nào khác.
            · `anh` tối thiểu 40 ký tự. Viết cụ thể: bài này đi vào
              mắt xích nào, qua đường nào, và làm nó căng thêm hay dịu
              đi. Đừng viết câu chung chung dùng cho bài nào cũng được.
            · Không chắc bài nào đó liên quan thì BỎ QUA nó. Thiếu một
              mục thì giao diện nói rõ là chưa có phân tích; bịa một
              mục thì không ai biết là bịa.
            · Chỉ ghi đúng file tin-phan-tich.json. Không sửa file
              nào khác, không chạy lệnh nào, không tìm web.

            Việc này chỉ coi là xong khi FILE đã tồn tại trên đĩa. Ghi
            ngay sau chủ thể đầu tiên rồi bổ sung dần — hết giờ giữa
            chừng vẫn còn kết quả một phần thay vì mất trắng.

      # Cùng bài học của lượt #15: bước gọi model báo thành công mà
      # không ghi file là chuyện đã xảy ra thật. Soi thẳng ra
      # annotation để đọc được mà không phải tải log.
      - name: Soi phân tích thô
        if: always() && steps.n-tin-ai.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 1
        run: |
          Q=dai-quan-trac/assets/data/tin-phan-tich.json
          if [ ! -f "$Q" ]; then
            echo "::error::Bước phân tích xong mà KHÔNG ghi $Q. Thư mục có: $(ls -A dai-quan-trac/assets/data/ 2>/dev/null | tr '\n' ' ')"
            exit 0
          fi
          echo "::notice::tin-phan-tich.json $(wc -c < "$Q") byte · $(node -e "
            try{const q=require('./$Q');
              const c=(q.chuThe||[]);
              console.log(c.map(x=>x.id+':'+((x.phanTich||[]).length)).join(' '));
            }catch(e){console.log('JSON hỏng: '+e.message.slice(0,80))}")"

      # Chỉ chạy khi bước model THÀNH CÔNG. Model ngã mà vẫn dựng thì
      # tin.js bị ghi đè bằng bản không có phân tích nào — mất hết lớp
      # suy luận của lượt trước để đổi lấy vài tiêu đề mới hơn.
      - name: Dựng dòng tin
        id: n-dong-tin
        if: steps.n-tin-ai.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          t0=$(date +%s)
          node scripts/build-dong-tin.mjs 2>&1 | tee "$RUNNER_TEMP/dong-tin.log"
          echo "giay=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"

      - name: Ghi sổ · dong-tin
        if: always() && steps.n-tin-de.outcome != 'skipped'
        env:
          KET: ${{ steps.n-dong-tin.outcome == 'success' && 'ok' || 'loi' }}
          T_DAU: ${{ steps.n-tin-de.outputs.t0 }}
          GIAY_DUNG: ${{ steps.n-dong-tin.outputs.giay }}
        run: |
          TONG=""
          [ -n "$T_DAU" ] && TONG=$(( $(date +%s) - T_DAU ))
          node scripts/nha-may.mjs ghi dong-tin "$KET" \
            ${TONG:+--giay $TONG} \
            --ghi "dựng ${GIAY_DUNG:-?}s · haiku-4-5 · không WebSearch" \
            --log "$RUNNER_TEMP/dong-tin.log"

      # ── M09 · Vòng tiến hoá ─────────────────────────────────────
      # Node DUY NHẤT sửa MÃ NGUỒN. Ba khác biệt so với mọi node kia:
      #
      # 1. NHỊP 24 GIỜ, không phải 6. Một lượt sửa giao diện mỗi ngày
      #    đủ nhanh để tiến và đủ chậm để người còn đọc kịp diff.
      # 2. CÓ BƯỚC HOÀN NGUYÊN. Node dữ liệu hỏng thì giữ bản cũ là
      #    xong; node này hỏng thì file người dùng NẠP đã bị ghi đè.
      # 3. CỔNG CHẶN QUYẾT ĐỊNH, không phải mã thoát của model. Model
      #    báo thành công mà làm hỏng trang là chuyện đã xảy ra ở lượt
      #    #15 với bản quét; ở đây hậu quả nặng hơn nhiều.
      - name: Ra đề tiến hoá — Đài Quan Trắc
        id: n-th-de
        if: env.CCOT != '' && contains(steps.kehoach.outputs.han, ',tien-hoa-dqt,')
        continue-on-error: true
        timeout-minutes: 4
        run: |
          echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"
          # `--ghi` cất phiếu GỐC để cổng chặn còn có cái mà đối chiếu.
          # Đo sau khi model đã sửa rồi mới nghĩ tới việc so là mất mốc.
          node scripts/tien-hoa.mjs do dai-quan-trac --ghi "$RUNNER_TEMP/dqt-goc.json"
          node scripts/tien-hoa.mjs de-bai dai-quan-trac
          # node tự ghi `yeu=N` vào $GITHUB_OUTPUT và tự in ::notice::
          # kèm tên thước đang trượt. Bash KHÔNG ghép chuỗi quanh JSON —
          # bản trước làm thế và bash báo syntax error, hỏng cả bước
          # suốt chín lượt trong khi phiếu vẫn đo xong bình thường.
          node scripts/tien-hoa.mjs tom-tat dai-quan-trac --ra "$GITHUB_OUTPUT"

      # Chụp mốc TRƯỚC khi model chạm vào. Không có nó thì bước hoàn
      # nguyên không biết trả về đâu.
      - name: Đánh dấu mốc trước khi sửa
        id: n-th-moc
        if: steps.n-th-de.outcome == 'success'
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Chụp cả danh sách file ĐÃ BẨN SẴN, vì `rev-parse HEAD` chỉ
          # biết commit cuối. Ba bước dữ liệu Quan Trắc chạy TRƯỚC bước
          # này đã ghi do.js · scan.js · tin.js mà chưa commit, nên phép
          # soát phạm vi bên dưới so với HEAD sẽ LUÔN thấy chúng nằm
          # ngoài `CHO` và LUÔN trả lại.
          #
          # Đã cắn thật: node ngã 9 lượt liên tiếp, chưa thành công lần
          # nào (`lucOk: null`), mỗi lượt đúng 2 giây — chết trước cả khi
          # model kịp chạy — trong khi cả ba lệnh `do`/`de-bai`/`cong`
          # đều chạy sạch ở máy. Bảng vận hành báo "loi" mà không ai lần
          # ra vì lỗi nằm ở YAML chứ không ở script.
          git diff --name-only -- dai-quan-trac > "$RUNNER_TEMP/dqt-ban-truoc.txt"

      # Trước đây bước này khoá bằng `outputs.yeu != '0'`: hết điểm yếu
      # thì không gọi model. Ý ban đầu đúng — không đi tìm việc cho
      # model. Nhưng hệ quả đo được: phiếu Đài Quan Trắc đầy từ
      # 30/08/2026, và từ đó tới 02/09 nó KHÔNG tiến thêm bước nào,
      # trong khi mười một cung kia nâng cấp mỗi ngày.
      #
      # Mười một cung ấy không có khoá này, và chúng không lãng phí:
      # tu-cam-thanh lượt 02/09 đủ 16/16 vẫn tìm ra thẻ .ph mang <h3>
      # ở tám chỗ mà cung chỉ có luật `.the h3`, nên chúng rơi về mặc
      # định trình duyệt — to hơn cả h2 của mục. Không thước nào đo
      # được chuyện đó, và nó có thật.
      #
      # Cổng chặn vẫn là thứ quyết định: bản vá làm tụt điểm thì bị
      # trả lại, y như lượt ho-bo 02/09 (16/16 → 15/16, `tra-lai`).
      - name: Đề xuất bản vá (Claude Code)
        id: n-th-va
        if: steps.n-th-de.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-haiku-4-5
            --max-turns 40
            --allowedTools "Read,Write,Edit,WebFetch"
          prompt: |
            Đọc dai-quan-trac/assets/data/de-bai-tien-hoa.json.

            Trong đó có:
            · `phieu.diem` — mỗi thước có `dat` (true/false) và
              `y` (số đo cụ thể). Thước nào `dat: false` là điểm yếu.
            · `phieu.tuongPhanXau` — cặp màu chưa đạt WCAG AA, kèm tỉ lệ.
            · `kyNang` — skill Tàng Thư Các đã chọn sẵn cho ĐÚNG những
              điểm yếu đó, mỗi cái có `doc` là URL đọc được bằng WebFetch.

            Trình tự:
            1. Với mỗi mục trong `kyNang` có trường `doc`, dùng WebFetch
               đọc SKILL.md đó. Đấy là kinh nghiệm người khác đã viết
               ra; đọc trước khi tự nghĩ.
            2. Xem `phieu.diem` — thước nào `dat: false` là điểm yếu đo
               được. Chọn MỘT cái có số đo tệ nhất và sửa DUY NHẤT nó.
            3. Nếu mọi thước đều đạt, tìm MỘT chỗ làm trang dễ đọc hoặc
               dễ dùng hơn mà KHÔNG thước nào đo được: nhãn khó hiểu,
               thứ bậc thị giác lẫn lộn, khoảng cách không đều, trạng
               thái trống không nói được gì, chữ số không đứng cột.

            CHỈ được sửa những file này:
              dai-quan-trac/index.html
              dai-quan-trac/assets/css/app.css
              dai-quan-trac/assets/css/halls.css
              dai-quan-trac/assets/js/app.js
              dai-quan-trac/assets/js/trang/dong.js
              dai-quan-trac/assets/js/trang/bang.js
              dai-quan-trac/assets/js/trang/soi.js
              dai-quan-trac/assets/js/trang/nen.js

            Chú ý assets/js/soi.js và assets/js/trang/soi.js là HAI
            file khác nhau. Cái ở trang/ là hàm vẽ, được sửa; cái ở
            gốc là nội dung, không được sửa.

            Luật, vi phạm luật nào cũng làm CẢ bản vá bị trả lại:
            · KHÔNG sửa file nào khác. Không đụng data.js, tq/data.js,
              tk/data.js, soi.js — đó là nội dung, không phải giao diện.
            · KHÔNG sửa file bot ghi: do.js, scan.js, tin.js, tq/*.
            · KHÔNG đổi chữ nghĩa hiển thị. Đây là vòng sửa GIAO DIỆN.
            · KHÔNG thêm thư viện, thẻ script, hay lời gọi mạng.
            · Sửa NHỎ. Một điểm yếu, một bản vá. Sửa lớn thì cổng chặn
              trượt và cả lượt bị hoàn nguyên, tức công cốc.
            · Đường dẫn phải TƯƠNG ĐỐI. Đường tuyệt đối là trượt ngay.

            Cuối cùng, ghi một dòng ngắn nói bạn đã đổi gì và vì sao,
            vào dai-quan-trac/assets/data/de-bai-tien-hoa.json dưới khoá
            `daLam`. Hai lượt trước để trống khoá đó, nên sổ tiến hoá
            chỉ ghi được điểm số mà không ghi được việc.

      # Cổng chặn quyết định, KHÔNG phải model. `--so` bắt thêm trường
      # hợp "vẫn chạy nhưng XẤU ĐI" mà năm phép kia không thấy: đổi
      # màu thành khó nhìn, gỡ một nhãn, phình file.
      #
      # Trước đó còn một phép của riêng node này: bản vá chỉ được chạm
      # những file GIAO DIỆN viết tay. Ra ngoài là trả lại cả bản vá, kể
      # cả khi cổng chặn xanh — sửa data.js hay tin.js thì không phải
      # tiến hoá giao diện nữa.
      #
      # Danh sách này từng chỉ có app.css và app.js, đúng vào ngày app.js
      # còn giữ cả 16 hàm vẽ. Sau khi 16 hàm ấy tách sang assets/js/trang/
      # thì phần lớn giao diện nằm NGOÀI phạm vi của chính vòng sửa giao
      # diện, và model sửa đúng chỗ cần sửa lại làm hỏng cả lượt.
      #
      # Vẫn ở ngoài, có lý do: halls.js và v/tri-thuc.js do máy sinh nên
      # sửa tay là mất ở lượt sinh sau; khung.js là lớp phương pháp chứ
      # không phải lớp vẽ; pwa.js đụng vòng đời service worker, hỏng ở
      # đó thì người dùng kẹt bản cũ mà cổng chặn không thấy.
      - name: Cổng chặn — nhận hay trả lại
        id: n-th-cong
        if: always() && steps.n-th-va.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 4
        env:
          MOC: ${{ steps.n-th-moc.outputs.sha }}
        run: |
          BAN_TRUOC="$RUNNER_TEMP/dqt-ban-truoc.txt"
          [ -f "$BAN_TRUOC" ] || : > "$BAN_TRUOC"
          # MOI = thứ bản vá làm bẩn, đã trừ thứ đã bẩn từ trước.
          MOI=$(git diff --name-only "$MOC" -- dai-quan-trac | grep -vxF -f "$BAN_TRUOC" || true)
          # Danh sách này phải khớp lời nhắc ở bước trên. Lệch nhau là
          # model làm đúng lời dặn rồi vẫn bị trả lại — không log nào nói
          # ra chỗ lệch, vì cả hai bên đều đang tự cho là mình đúng.
          CHO='dai-quan-trac/index.html
               dai-quan-trac/assets/css/app.css
               dai-quan-trac/assets/css/halls.css
               dai-quan-trac/assets/js/app.js
               dai-quan-trac/assets/js/trang/dong.js
               dai-quan-trac/assets/js/trang/bang.js
               dai-quan-trac/assets/js/trang/soi.js
               dai-quan-trac/assets/js/trang/nen.js'
          # `echo` không bọc nháy: gộp mọi xuống dòng và thụt lề thành
          # một dấu cách, để phép so `*" $f "*` bên dưới còn khớp được.
          CHO=$(echo $CHO)
          NGOAI=''
          for f in $MOI; do
            case " $CHO " in *" $f "*) ;; *) NGOAI="$NGOAI $f" ;; esac
          done
          if [ -n "$NGOAI" ]; then
            echo "::error::Bản vá chạm file ngoài phạm vi:$NGOAI"
            if [ -n "$MOI" ]; then git checkout -- $MOI; fi
            exit 1
          fi
          if node scripts/tien-hoa.mjs cong dai-quan-trac --so "$RUNNER_TEMP/dqt-goc.json" 2>&1 \
               | tee "$RUNNER_TEMP/tien-hoa-dqt.log"; then
            # nang-version chạy TOÀN SITE, nên phải khoanh lại — nhưng
            # khoanh theo "không phải cung tôi" thì SAI, và đã sai thật:
            # bốn bước tiến hoá chạy nối nhau trong CÙNG một lượt, và bản
            # nâng của bước trước vẫn đang là thay đổi CHƯA COMMIT. Bước
            # sau thấy chúng trong `git diff` rồi trả lại luôn, nên chỉ
            # cung của bước CUỐI giữ được bản nâng. Bốn lượt bot liền
            # (b1a2ef9 · 5aa521e · 16970d5 · 8ba1864) đều chỉ nâng đúng
            # kham-thien-giam — bước cuối cùng.
            #
            # Nên chụp danh sách sw.js đã bẩn TRƯỚC, rồi chỉ trả lại thứ
            # chính bước này vừa làm bẩn.
            SW_BAN_TRUOC=$(git diff --name-only -- '*/sw.js')
            node scripts/nang-version.mjs
            git checkout -- $(git diff --name-only -- '*/sw.js' | grep -v '^dai-quan-trac/' | grep -vxF "$SW_BAN_TRUOC" || true)
            echo "::notice::Vòng tiến hoá Đài Quan Trắc: NHẬN"
          else
            echo "::error::Vòng tiến hoá Đài Quan Trắc: TRẢ LẠI — cổng chặn không qua"
            # Trả lại đúng thứ bước NÀY làm bẩn. `git checkout -- dai-quan-trac/`
            # là cuốn theo cả do.js · scan.js · tin.js mà ba bước dữ liệu vừa
            # ghi trong CÙNG lượt — một lượt tiến hoá trượt thành một lượt mất
            # số liệu, và không dòng log nào nói ra điều đó.
            HONG=$(git diff --name-only "$MOC" -- dai-quan-trac | grep -vxF -f "$BAN_TRUOC" || true)
            if [ -n "$HONG" ]; then git checkout -- $HONG; fi
            exit 1
          fi

      - name: Ghi sổ · tien-hoa-dqt
        if: always() && steps.n-th-de.outcome != 'skipped'
        env:
          # Phiếu đầy đủ (không gọi model) cũng là `ok`: node đã chạy,
          # đã đo, và kết luận đúng là không có gì phải sửa.
          KET: ${{ steps.n-th-cong.outcome == 'success' && 'ok' || 'loi' }}
          YEU: ${{ steps.n-th-de.outputs.yeu }}
          T_DAU: ${{ steps.n-th-de.outputs.t0 }}
          # Ba mã kết cục, để sổ nói ĐÚNG CHỖ ngã. Bản cũ ghi cứng
          # "cổng chặn quyết định" cho mọi lượt lỗi — kể cả lượt chưa
          # bao giờ tới được cổng. Và nó đã lừa đúng như thế: chín lượt
          # liền sổ đổ cho cổng, trong khi thứ hỏng là một dòng echo ở
          # bước RA ĐỀ, ngã sau hai giây. Hai phiên đi tìm nhầm chỗ vì
          # tin vào dòng chữ đó.
          #
          # `continue-on-error` trên bước ra đề còn phủ thêm một lớp:
          # API báo conclusion=success trong khi outcome=failure, nên
          # nhìn từ ngoài bước ấy trông như đã chạy xong.
          KC_DE: ${{ steps.n-th-de.outcome }}
          KC_VA: ${{ steps.n-th-va.outcome }}
          KC_CONG: ${{ steps.n-th-cong.outcome }}
        run: |
          TONG=""
          [ -n "$T_DAU" ] && TONG=$(( $(date +%s) - T_DAU ))
          # Tên bước ngã đứng TRƯỚC trong chuThich: thấy "loi" thì đó
          # là thứ người đọc sổ cần biết đầu tiên.
          NGA=""
          if [ "$KC_DE" != "success" ]; then
            NGA="ngã ở RA ĐỀ ($KC_DE) — model chưa hề chạy"
          elif [ "$KC_VA" = "failure" ]; then
            NGA="ngã ở MODEL"
          elif [ "$KC_CONG" = "failure" ]; then
            NGA="cổng chặn TRẢ LẠI"
          fi
          # Điểm phiếu moi từ log cổng chặn, y như các node tiến hoá
          # khác. Không có nó thì "có tiến hoá thật không" là câu không
          # ai trả lời được sau ba tháng chạy.
          DIEM=$(grep -oE "phiếu đo [0-9]+/[0-9]+ → [0-9]+/[0-9]+" \
            "$RUNNER_TEMP/tien-hoa-dqt.log" 2>/dev/null | tail -1)
          node scripts/nha-may.mjs ghi tien-hoa-dqt "$KET" \
            ${TONG:+--giay $TONG} \
            --ghi "${NGA:+$NGA · }${DIEM:-${YEU:-?} điểm yếu} · haiku-4-5" \
            --log "$RUNNER_TEMP/tien-hoa-dqt.log"

      # ── M15 · Máy kiểm ─────────────────────────────────────────
      # Sơ đồ xưởng ghi "không có gì ra khỏi xưởng mà chưa qua kiểm",
      # nhưng cho tới nay thì đúng là không có bước kiểm nào: script
      # thoát 0 là `git add` gom hết rồi đẩy thẳng lên Pages.
      #
      # Thoát 0 mà ghi ra file cụt là hoàn toàn im lặng. Đó là cách
      # hỏng tệ nhất trong xưởng này, vì mọi đèn vẫn xanh.
      #
      # Phải chạy TRƯỚC bước chiếu: nó có thể hạ một node xuống `loi`,
      # và Bảng vận hành phải hiện bản sau khi kiểm, không phải bản
      # trước. Cũng phải trước `git add` — nó trả file hỏng về bản cũ,
      # gom rồi mới trả thì đã gom nhầm.
      # ── M18 · VÒNG TIẾN HOÁ GIAO DIỆN ───────────────────────────
      # Node DUY NHẤT trong xưởng sửa MÃ chứ không sửa dữ liệu. Mọi
      # node khác ghi vào assets/js/v/ hoặc data.js; node này ghi thẳng
      # vào app.css, app.js, index.html — thứ trình duyệt nạp làm hành vi.
      #
      # Luật xương sống của repo nói "đừng cho model ghi thẳng scan.js —
      # một lỗi cú pháp là một trang trắng". Ở đây model được ghi thẳng,
      # và điều khiến chuyện đó không mâu thuẫn là hai lớp số học kẹp
      # nó ở giữa, cả hai đều không do model viết:
      #
      #   do --ghi   chấm phiếu mọi thước TRƯỚC khi model đụng vào gì
      #   cong --so  chấm lại SAU, chặn nếu VỠ hoặc nếu ĐIỂM TỤT
      #
      # Trượt bất kỳ đầu nào là `git checkout -- ho-bo/` trả cả thư mục
      # cung về bản cũ. Không có gì nửa vời lên site.
      - name: Chấm phiếu gốc và ra đề — Hộ Bộ
        id: n-th-goc
        if: env.CCOT != '' && contains(steps.kehoach.outputs.han, ',ho-bo-tien-hoa,')
        continue-on-error: true
        timeout-minutes: 3
        run: |
          echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"
          node scripts/tien-hoa.mjs do ho-bo --ghi "$RUNNER_TEMP/hobo-goc.json"
          node scripts/tien-hoa.mjs de-bai ho-bo

      - name: Bấm giờ · trước khi tiến hoá
        id: gio-th-0
        if: steps.n-th-goc.outcome == 'success'
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Opus 5 chứ không Haiku, và lý do ngược với node quét Đài Quan
      # Trắc: ở đó WebSearch kéo nguyên nội dung trang vào ngữ cảnh nên
      # khối lượng phình không chặn được. Ở đây khối lượng CỐ ĐỊNH —
      # một phiếu đo, tối đa 8 SKILL.md, và bốn file của đúng một cung.
      # Chỗ khối lượng chặn được thì dùng model mạnh, vì phần giá trị
      # nhất là phán đoán "sửa chỗ nào thì đáng", đúng chỗ model mạnh
      # hơn thấy rõ hơn. Cùng lập luận với node bao-cao.
      - name: Tiến hoá giao diện (Claude Code)
        id: n-th-lam
        if: steps.n-th-goc.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5
            --max-turns 24
            --allowedTools "Read,Write,Edit,WebFetch"
          prompt: |
            Đọc ho-bo/assets/data/de-bai-tien-hoa.json.

            Trong đó có `phieu` — kết quả chấm cung Hộ Bộ theo các thước
            đo được — và `kyNang`, các kỹ năng chọn từ kho Tàng Thư Các
            khớp với những thước đang trượt.

            Và `luuY` — lời dặn cho những thước mà cách chữa KHÔNG
            nằm ở lớp giao diện. Thước nào có mặt ở đó thì đọc lời
            dặn TRƯỚC khi vá; làm điểm lên bằng cách nó cấm là đang
            tối ưu cho việc che, không phải cho người xem.

            VIỆC CỦA BẠN: làm cung Hộ Bộ tốt lên MỘT BƯỚC, đúng một bước.

            Trình tự:
            1. Với mỗi mục trong `kyNang` có trường `doc`, dùng WebFetch
               đọc SKILL.md đó. Đấy là kinh nghiệm người khác đã viết ra;
               đọc trước khi tự nghĩ.
            2. Xem `phieu.diem` — thước nào `dat: false` là điểm yếu đo
               được. Ưu tiên chúng trước.
            3. Nếu mọi thước đều đạt, hãy tìm MỘT chỗ làm trang dễ
               đọc hoặc dễ dùng hơn mà không thước nào đo được: nhãn khó
               hiểu, thứ bậc thị giác lẫn lộn, khoảng cách không đều,
               trạng thái trống không nói được gì.

            Chỉ sửa trong bốn file này, không file nào khác:
              ho-bo/assets/css/app.css
              ho-bo/assets/js/app.js
              ho-bo/index.html

            LUẬT, đọc kỹ — có cổng chặn tự động sau bạn:
            · MỘT bước thôi. Một thay đổi mạch lạc, không phải năm thứ
              rời rạc. Sửa ít mà đúng hơn sửa nhiều mà loãng.
            · KHÔNG đổi cấu trúc dữ liệu, không đổi tên khoá trong
              window.HOBU, không bỏ phòng nào, không đổi tuyến hash.
            · KHÔNG thêm thư viện ngoài, không thêm thẻ <script> mới.
              Trang này chạy offline và không có bước dựng.
            · GIỮ mọi aria-label và aria-hidden đang có. Gỡ một nhãn là
              cổng chặn hạ điểm và trả lại toàn bộ việc bạn vừa làm.
            · Màu mới phải đạt tương phản WCAG AA (4.5) trên MỌI nền
              --bg/--bg-2/--card/--card-2/--card-3. Đây là thước đã
              trượt một lần rồi, đừng làm trượt lại.
            · Đừng đụng vào assets/js/v/ — bot số liệu ghi thư mục đó.

            Cuối cùng, ghi một dòng ngắn nói bạn đã đổi gì và vì sao,
            vào ho-bo/assets/data/de-bai-tien-hoa.json dưới khoá `daLam`.

      - name: Bấm giờ · sau khi tiến hoá
        id: gio-th-1
        if: always() && steps.gio-th-0.outcome == 'success'
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Cổng chặn quyết định, KHÔNG phải model. Qua thì nâng
      # CACHE_VERSION (bốn file kia nằm trong SHELL, quên nâng là máy
      # đã cài app giữ giao diện cũ). Trượt thì trả cả thư mục cung về
      # bản cũ — cùng lối "hỏng thì giữ bản cũ" của build-scan.mjs.
      - name: Cổng chặn — nhận hay trả lại
        id: n-ho-bo-tien-hoa
        if: always() && steps.n-th-lam.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          if node scripts/tien-hoa.mjs cong ho-bo --so "$RUNNER_TEMP/hobo-goc.json" 2>&1 | tee "$RUNNER_TEMP/ho-bo-tien-hoa.log"; then
            SW_BAN_TRUOC=$(git diff --name-only -- '*/sw.js')
            node scripts/nang-version.mjs
            git checkout -- $(git diff --name-only -- '*/sw.js' | grep -v '^ho-bo/' | grep -vxF "$SW_BAN_TRUOC" || true)
            echo "::notice::Vòng tiến hoá Hộ Bộ: NHẬN"
          else
            echo "::error::Vòng tiến hoá Hộ Bộ: TRẢ LẠI — cổng chặn không qua"
            # Trừ assets/js/v/ ra: bước "Lấy dòng tiền" chạy TRƯỚC bước này
            # trong cùng lượt, nên trả cả thư mục là ném luôn dong-tien.js
            # vừa lấy về. Chưa nổ vì cổng Hộ Bộ chưa trượt lần nào — cùng
            # cái bẫy đã giết node tiến hoá Đài Quan Trắc 9 lượt liền.
            HONG=$(git diff --name-only -- ho-bo | grep -v '^ho-bo/assets/js/v/' || true)
            if [ -n "$HONG" ]; then git checkout -- $HONG; fi
            exit 1
          fi

      - name: Ghi sổ · ho-bo-tien-hoa
        if: always() && steps.n-th-goc.outcome != 'skipped'
        env:
          KET: ${{ steps.n-ho-bo-tien-hoa.outcome == 'success' && 'ok' || 'loi' }}
          T_DAU: ${{ steps.n-th-goc.outputs.t0 }}
          TQ0: ${{ steps.gio-th-0.outputs.t }}
          TQ1: ${{ steps.gio-th-1.outputs.t }}
        run: |
          TONG=""
          [ -n "$T_DAU" ] && TONG=$(( $(date +%s) - T_DAU ))
          LAM="?"
          [ -n "$TQ0" ] && [ -n "$TQ1" ] && LAM=$(( TQ1 - TQ0 ))
          # Điểm phiếu vào chuThich, moi ra từ chính log của cổng chặn.
          # Không có nó thì sổ chỉ ghi ok/loi, và "có tiến hoá thật
          # không" là câu KHÔNG AI TRẢ LỜI ĐƯỢC sau ba tháng chạy —
          # một vòng tự tiến hoá mà không đo được là một vòng chạy
          # không tải. chieu() đã chiếu chuThich sang Bảng vận hành nên
          # quỹ đạo điểm hiện thẳng trên trang, không phải mở log.
          DIEM=$(grep -oE "phiếu đo [0-9]+/[0-9]+ → [0-9]+/[0-9]+" \
            "$RUNNER_TEMP/ho-bo-tien-hoa.log" 2>/dev/null | tail -1)
          node scripts/nha-may.mjs ghi ho-bo-tien-hoa "$KET" \
            ${TONG:+--giay $TONG} \
            --ghi "${DIEM:-chưa chấm được} · model ${LAM}s · opus-5" \
            --log "$RUNNER_TEMP/ho-bo-tien-hoa.log"


      # ── VÒNG TIẾN HOÁ · Thái Bộc Tự ────────────────────────────
      # Cung thứ hai dùng đúng bộ máy của ho-bo-tien-hoa. Không script
      # mới, chỉ đổi tên cung — đúng lời hứa ở đầu scripts/tien-hoa.mjs.
      #
      # Phiếu đo lúc bật: 6/7. Thước trượt là tương phản màu, 5/15 cặp
      # dưới WCAG AA, thấp nhất 2.83 (--fg-3 trên --card-3). Đó là việc
      # của lượt đầu tiên.
      - name: Tiến hoá TBT 1/3 — chấm phiếu gốc và ra đề
        id: n-tbt-goc
        if: env.CCOT != '' && contains(steps.kehoach.outputs.han, ',thai-boc-tu-tien-hoa,')
        continue-on-error: true
        timeout-minutes: 3
        run: |
          echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"
          node scripts/tien-hoa.mjs do thai-boc-tu --ghi "$RUNNER_TEMP/tbt-goc.json"
          node scripts/tien-hoa.mjs de-bai thai-boc-tu

      - name: Tiến hoá giao diện Thái Bộc Tự (Claude Code)
        id: n-tbt-lam
        if: steps.n-tbt-goc.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5
            --max-turns 24
            --allowedTools "Read,Write,Edit,WebFetch"
          prompt: |
            Đọc thai-boc-tu/assets/data/de-bai-tien-hoa.json.

            Trong đó có `phieu` — kết quả chấm cung Thái Bộc Tự theo
            các thước đo được — và `kyNang`, các kỹ năng chọn từ kho
            Tàng Thư Các khớp với những thước đang trượt.

            Và `luuY` — lời dặn cho những thước mà cách chữa KHÔNG
            nằm ở lớp giao diện. Thước nào có mặt ở đó thì đọc lời
            dặn TRƯỚC khi vá; làm điểm lên bằng cách nó cấm là đang
            tối ưu cho việc che, không phải cho người xem.

            VIỆC CỦA BẠN: làm cung Thái Bộc Tự tốt lên MỘT BƯỚC, đúng
            một bước.

            Trình tự:
            1. Với mỗi mục trong `kyNang` có trường `doc`, dùng
               WebFetch đọc SKILL.md đó. Đấy là kinh nghiệm người khác
               đã viết ra; đọc trước khi tự nghĩ.
            2. Xem `phieu.diem` — thước nào `dat: false` là điểm yếu
               đo được. Ưu tiên chúng trước.
            3. Nếu mọi thước đều đạt, tìm MỘT chỗ làm trang dễ đọc
               hơn mà không thước nào đo được: nhãn khó hiểu, thứ bậc
               thị giác lẫn lộn, khoảng cách không đều, trạng thái
               trống không nói được gì.

            Chỉ sửa trong ba file này, không file nào khác:
              thai-boc-tu/assets/css/app.css
              thai-boc-tu/assets/js/app.js
              thai-boc-tu/index.html

            LUẬT, đọc kỹ — có cổng chặn tự động sau bạn:
            · MỘT bước thôi. Một thay đổi mạch lạc, không phải năm thứ
              rời rạc. Sửa ít mà đúng hơn sửa nhiều mà loãng.
            · KHÔNG đổi cấu trúc dữ liệu, không đổi tên khoá trong
              window.THAIBOC / THAIBOC_CT / THAIBOC_TIN / THAIBOC_TOA,
              không bỏ phòng nào, không đổi tuyến hash.
            · KHÔNG sửa assets/js/toa.js. Đó là sổ 18 toa — luận và
              hồ sơ, tức nội dung chứ không phải giao diện.
            · KHÔNG thêm thư viện ngoài, không thêm thẻ <script> mới.
              Trang này chạy offline và không có bước dựng.
            · GIỮ mọi aria-label và aria-hidden đang có. Gỡ một nhãn là
              cổng chặn hạ điểm và trả lại toàn bộ việc bạn vừa làm.
            · Màu mới phải đạt tương phản WCAG AA (4.5) trên MỌI nền
              --bg/--bg-2/--card/--card-2/--card-3.
            · Đừng đụng vào assets/js/v/ — bot số liệu ghi thư mục đó.

            BA LUẬT RIÊNG CỦA CUNG NÀY, đọc mã nguồn sẽ thấy lặp lại:
            1. Không bịa số. Thiếu dữ liệu thì vẽ dấu gạch, KHÔNG vẽ 0.
            2. Thứ ĐO ĐƯỢC và thứ LUẬN RA không bao giờ trông giống
               nhau — phần luận luôn mang huy hiệu riêng.
            3. Mọi con số truy ngược được về nguồn.

            Cuối cùng, ghi một dòng ngắn nói bạn đã đổi gì và vì sao,
            vào thai-boc-tu/assets/data/de-bai-tien-hoa.json dưới khoá
            `daLam`.

      - name: Cổng chặn TBT — nhận hay trả lại
        id: n-thai-boc-tu-tien-hoa
        if: always() && steps.n-tbt-lam.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          if node scripts/tien-hoa.mjs cong thai-boc-tu --so "$RUNNER_TEMP/tbt-goc.json" 2>&1 | tee "$RUNNER_TEMP/thai-boc-tu-tien-hoa.log"; then
            SW_BAN_TRUOC=$(git diff --name-only -- '*/sw.js')
            node scripts/nang-version.mjs
            git checkout -- $(git diff --name-only -- '*/sw.js' | grep -v '^thai-boc-tu/' | grep -vxF "$SW_BAN_TRUOC" || true)
            echo "::notice::Vòng tiến hoá Thái Bộc Tự: NHẬN"
          else
            echo "::error::Vòng tiến hoá Thái Bộc Tự: TRẢ LẠI — cổng chặn không qua"
            git checkout -- thai-boc-tu/
            exit 1
          fi

      - name: Ghi sổ · thai-boc-tu-tien-hoa
        if: always() && steps.n-tbt-goc.outcome != 'skipped'
        env:
          KET: ${{ steps.n-thai-boc-tu-tien-hoa.outcome == 'success' && 'ok' || 'loi' }}
          T_DAU: ${{ steps.n-tbt-goc.outputs.t0 }}
        run: |
          TONG=""
          [ -n "$T_DAU" ] && TONG=$(( $(date +%s) - T_DAU ))
          DIEM=$(grep -oE "phiếu đo [0-9]+/[0-9]+ → [0-9]+/[0-9]+" \
            "$RUNNER_TEMP/thai-boc-tu-tien-hoa.log" 2>/dev/null | tail -1)
          # Chấm lại MỘT lần nữa chỉ để lấy TÊN thước trượt. Rẻ — thuần
          # số học, không gọi model. Vì sao cần: sáu lượt 22–27/08 đều
          # ghi "6/7 → 6/7" trong khi đo lại chính những commit đó bằng
          # đúng thước cùng thời đều ra 7/7. Lệch có thật, dai, và KHÔNG
          # tái hiện được ở máy — nên chỉ CI mới nói được nó trượt ở đâu.
          # Một vòng tự tiến hoá không đo được chính nó là vòng chạy
          # không tải.
          TRUOT=$(node scripts/tien-hoa.mjs do thai-boc-tu 2>/dev/null \
            | grep "^  ✗" | sed "s/^  ✗ *//; s/  */ /g" | cut -c1-58 \
            | paste -sd ";" - || true)
          node scripts/nha-may.mjs ghi thai-boc-tu-tien-hoa "$KET" \
            ${TONG:+--giay $TONG} \
            --ghi "${DIEM:-chưa chấm được}${TRUOT:+ · trượt: $TRUOT} · opus-5" \
            --log "$RUNNER_TEMP/thai-boc-tu-tien-hoa.log"


      # ── VÒNG TIẾN HOÁ · Tạo Biện Xứ ────────────────────────────
      # Cung thứ NĂM dùng đúng bộ máy này. Vẫn không script mới.
      #
      # Khác bốn cung trước ở một điểm đáng nói: phiếu đo lúc bật đã
      # 7/7. Không có thước nào trượt để mà vá — nên lượt đầu đi thẳng
      # vào nhánh "cả bảy thước đều đạt thì tìm MỘT chỗ làm trang dễ
      # đọc hơn mà không thước nào đo được".
      #
      # Đó chính là chỗ đáng thử nhất của cả vòng: bảy thước đo SÀN
      # (vẽ được, đọc được, có nhãn), chúng không với tới thứ bậc thị
      # giác, nhịp khoảng cách hay giọng của trang. Một cung 7/7 vẫn
      # có thể nhàm.
      #
      # Và cung này đáng chăm hơn cả — nó là chỗ người ta mở ra để
      # NHÌN cả nhà máy. Bảng vận hành hỏng thì mọi cung khác vẫn
      # chạy nhưng không ai thấy chúng chạy.
      - name: Tiến hoá TBX 1/3 — chấm phiếu gốc và ra đề
        id: n-tbx-goc
        if: env.CCOT != '' && contains(steps.kehoach.outputs.han, ',tao-bien-xu-tien-hoa,')
        continue-on-error: true
        timeout-minutes: 3
        run: |
          echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"
          node scripts/tien-hoa.mjs do tao-bien-xu --ghi "$RUNNER_TEMP/tbx-goc.json"
          node scripts/tien-hoa.mjs de-bai tao-bien-xu

      - name: Tiến hoá giao diện Tạo Biện Xứ (Claude Code)
        id: n-tbx-lam
        if: steps.n-tbx-goc.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5
            --max-turns 24
            --allowedTools "Read,Write,Edit,WebFetch"
          prompt: |
            Đọc tao-bien-xu/assets/data/de-bai-tien-hoa.json.

            Trong đó có `phieu` — kết quả chấm cung Tạo Biện Xứ theo
            bảy thước đo được — và `kyNang`, các kỹ năng chọn từ kho
            Tàng Thư Các khớp với những thước đang trượt.

            VIỆC CỦA BẠN: làm cung Tạo Biện Xứ tốt lên MỘT BƯỚC, đúng
            một bước.

            Trình tự:
            1. Với mỗi mục trong `kyNang` có trường `doc`, dùng
               WebFetch đọc SKILL.md đó. Đấy là kinh nghiệm người khác
               đã viết ra; đọc trước khi tự nghĩ.
            2. Xem `phieu.diem` — thước nào `dat: false` là điểm yếu
               đo được. Ưu tiên chúng trước.
            3. Cung này nhiều khả năng đã 7/7, nên phần lớn lượt sẽ
               rơi vào nhánh này: tìm MỘT chỗ làm trang dễ đọc hơn mà
               không thước nào đo được — thứ bậc thị giác lẫn lộn,
               khoảng cách không đều, nhãn khó hiểu, trạng thái trống
               không nói được gì.

            Chỉ sửa trong ba file này, không file nào khác:
              tao-bien-xu/assets/css/app.css
              tao-bien-xu/assets/js/app.js
              tao-bien-xu/index.html

            LUẬT, đọc kỹ — có cổng chặn tự động sau bạn:
            · MỘT bước thôi. Một thay đổi mạch lạc, không phải năm thứ
              rời rạc. Sửa ít mà đúng hơn sửa nhiều mà loãng.
            · KHÔNG sửa assets/js/data.js. Đó là bản thiết kế 18 máy
              viết tay — nội dung chứ không phải giao diện.
            · KHÔNG đụng assets/js/v/van-hanh.js. Đó là bản chiếu sổ
              nhà máy, bot ghi đè mỗi lượt.
            · KHÔNG đổi tuyến hash, không bỏ phòng nào, không đổi tên
              khoá trong window.TBX_DATA / window.VAN_HANH.
            · KHÔNG thêm thư viện ngoài, không thêm thẻ <script> mới.
              Trang này chạy offline và không có bước dựng.
            · KHÔNG nạp thêm bộ chữ. Hai bộ đang có (Be Vietnam Pro,
              IBM Plex Mono) là đủ; thêm bộ thứ ba là thêm một lượt
              tải mạng cho mọi người xem.
            · GIỮ mọi aria-label và aria-hidden đang có. Gỡ một nhãn là
              cổng chặn hạ điểm và trả lại toàn bộ việc bạn vừa làm.
            · Màu mới phải đạt tương phản WCAG AA (4.5) trên MỌI nền
              --bg/--bg-2/--card/--card-2/--card-3.

            HAI LUẬT RIÊNG CỦA CUNG NÀY:
            1. Năm màu tín hiệu (hổ phách · vàng · lục · lam · đỏ) mang
               NGHĨA, không phải trang trí: đang chạy · chờ người · đạt
               · đã giao · chặn. Đừng đổi nghĩa, đừng thêm màu thứ sáu.
            2. Bảng vận hành phải hiện SỐ THẬT từ sổ nhà máy. Đừng thêm
               số mô phỏng, đừng vẽ 0 khi thiếu dữ liệu — vẽ dấu gạch.

            Cuối cùng, ghi một dòng ngắn nói bạn đã đổi gì và vì sao,
            vào tao-bien-xu/assets/data/de-bai-tien-hoa.json dưới khoá
            `daLam`.

      - name: Cổng chặn TBX — nhận hay trả lại
        id: n-tao-bien-xu-tien-hoa
        if: always() && steps.n-tbx-lam.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          if node scripts/tien-hoa.mjs cong tao-bien-xu --so "$RUNNER_TEMP/tbx-goc.json" 2>&1 | tee "$RUNNER_TEMP/tao-bien-xu-tien-hoa.log"; then
            SW_BAN_TRUOC=$(git diff --name-only -- '*/sw.js')
            node scripts/nang-version.mjs
            git checkout -- $(git diff --name-only -- '*/sw.js' | grep -v '^tao-bien-xu/' | grep -vxF "$SW_BAN_TRUOC" || true)
            echo "::notice::Vòng tiến hoá Tạo Biện Xứ: NHẬN"
          else
            echo "::error::Vòng tiến hoá Tạo Biện Xứ: TRẢ LẠI — cổng chặn không qua"
            git checkout -- tao-bien-xu/
            exit 1
          fi

      - name: Ghi sổ · tao-bien-xu-tien-hoa
        if: always() && steps.n-tbx-goc.outcome != 'skipped'
        env:
          KET: ${{ steps.n-tao-bien-xu-tien-hoa.outcome == 'success' && 'ok' || 'loi' }}
          T_DAU: ${{ steps.n-tbx-goc.outputs.t0 }}
        run: |
          TONG=""
          [ -n "$T_DAU" ] && TONG=$(( $(date +%s) - T_DAU ))
          DIEM=$(grep -oE "phiếu đo [0-9]+/[0-9]+ → [0-9]+/[0-9]+" \
            "$RUNNER_TEMP/tao-bien-xu-tien-hoa.log" 2>/dev/null | tail -1)
          TRUOT=$(node scripts/tien-hoa.mjs do tao-bien-xu 2>/dev/null \
            | grep "^  ✗" | sed "s/^  ✗ *//; s/  */ /g" | cut -c1-58 \
            | paste -sd ";" - || true)
          node scripts/nha-may.mjs ghi tao-bien-xu-tien-hoa "$KET" \
            ${TONG:+--giay $TONG} \
            --ghi "${DIEM:-chưa chấm được}${TRUOT:+ · trượt: $TRUOT} · opus-5" \
            --log "$RUNNER_TEMP/tao-bien-xu-tien-hoa.log"


      # ── PHÂN TÍCH TIN · Thái Bộc Tự ────────────────────────────
      # Ba bước, cùng đường với bản quét Đài Quan Trắc và tách ba bước
      # vì cùng một lý do: ĐỪNG cho model ghi thẳng file .js. Nó viết
      # JSON thô; script kiểm rồi mới dựng. Bịa mã toa, bịa link, sai
      # mức — mục đó bị LOẠI chứ không được sửa hộ.
      #
      # Haiku chứ không Opus: việc ở đây là đọc một tiêu đề cộng hai
      # câu tóm tắt rồi xếp mức và vẽ mạch lan truyền — phán đoán có,
      # nhưng nông và lặp lại. Chỗ đáng dùng model mạnh là báo cáo
      # xưởng và vòng tiến hoá, nơi mỗi lượt chỉ một lời gọi.
      - name: Phân tích tin 1/2 — ra đề
        id: n-tbt-pt-de
        if: env.CCOT != '' && contains(steps.kehoach.outputs.han, ',thai-boc-tu-tin-pt,')
        continue-on-error: true
        timeout-minutes: 2
        run: |
          echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"
          node scripts/build-tin-phantich.mjs --de-bai

      - name: Phân tích tin — model đọc và chấm
        id: n-tbt-pt-lam
        if: steps.n-tbt-pt-de.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-haiku-4-5
            --max-turns 8
            --allowedTools "Read,Write"
          prompt: |
            Đọc thai-boc-tu/assets/data/tin-de-bai.json.

            Trong đó có `bai` — các bài tin cần chấm — và `toaHopLe`,
            danh sách 18 toa của cung với mã và tên.

            Với TỪNG bài, viết một phán đoán ngắn về ảnh hưởng thị trường.

            Ghi kết quả vào thai-boc-tu/assets/data/tin-phan-tich.json
            theo ĐÚNG khuôn này, không thêm khoá nào:

            {"bai": [
              {"link": "<chép nguyên link từ đề bài>",
               "muc": "cao" | "vua" | "thap",
               "toa": "<mã toa trong toaHopLe, hoặc null>",
               "mach": ["<bước 1>", "<bước 2>", "<bước 3>"],
               "theoDoi": "<một câu>",
               "nguoc": "<một câu>"}
            ]}

            LUẬT, đọc kỹ — có bộ kiểm tự động sau bạn, sai là mục bị LOẠI:
            · `link` phải chép NGUYÊN VĂN từ đề bài. Sửa một ký tự là loại.
            · `muc` chỉ được là ba chữ đó, viết thường, không dấu.
            · `toa` phải là mã CÓ THẬT trong `toaHopLe`. Không chắc thì
              để null — bịa mã là mục bị loại, và null thì vẫn giữ được
              phần còn lại.
            · `mach` có 2 tới 4 bước, mỗi bước dưới 90 ký tự. Đây là
              đường lan truyền: từ sự việc trong bài tới chỗ nó chạm vào
              hệ thống. Đừng viết lại tiêu đề.
            · `muc` chấm theo mức chạm vào HỆ THỐNG, không theo mức giật
              gân của tiêu đề. Một vụ lừa đảo 885.000 số điện thoại là tin
              lớn với người đọc nhưng "thap" với hệ thống — settlement vẫn
              chạy, thanh khoản không đổi.

            `theoDoi` và `nguoc` — quan trọng nhất, đọc kỹ:
            · KHÔNG viết lời khuyên mua bán. Không giá mục tiêu, không
              "nên mua", không "nên bán". Trang này không phải nơi khuyên
              đầu tư.
            · `theoDoi` là điều SẮP TỚI sẽ cho biết cách đọc này đúng hay
              sai. Phải cụ thể và kiểm được: một con số, một mốc, một
              hành động của một bên cụ thể.
            · `nguoc` là điều gì xảy ra thì cách đọc này SAI. Không viết
              được câu này nghĩa là phán đoán chưa đủ sắc — hạ `muc`
              xuống "thap" và viết mạch khiêm tốn hơn.

            Viết tiếng Việt. Ngắn, không hoa mỹ, không kết luận to hơn
            bằng chứng trong bài.

      - name: Phân tích tin 2/2 — kiểm và dựng
        id: n-thai-boc-tu-tin-pt
        if: always() && steps.n-tbt-pt-de.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/build-tin-phantich.mjs 2>&1 | tee "$RUNNER_TEMP/tbt-pt.log"
      - name: Ghi sổ · thai-boc-tu-tin-pt
        if: always() && steps.n-tbt-pt-de.outcome != 'skipped'
        env:
          KET: ${{ steps.n-thai-boc-tu-tin-pt.outcome == 'success' && 'ok' || 'loi' }}
          T_DAU: ${{ steps.n-tbt-pt-de.outputs.t0 }}
        run: |
          TONG=""
          [ -n "$T_DAU" ] && TONG=$(( $(date +%s) - T_DAU ))
          PHU=$(grep -oE "nhận [0-9]+ · loại [0-9]+ · phủ [0-9]+/[0-9]+ bài" \
            "$RUNNER_TEMP/tbt-pt.log" 2>/dev/null | tail -1)
          node scripts/nha-may.mjs ghi thai-boc-tu-tin-pt "$KET" \
            ${TONG:+--giay $TONG} \
            --ghi "${PHU:-chưa dựng được} · haiku-4.5" \
            --log "$RUNNER_TEMP/tbt-pt.log"

      # Cung thứ BA vào vòng tiến hoá. Vẫn không script mới, vẫn đúng
      # `scripts/tien-hoa.mjs <cung>` — lời hứa ở đầu file đó giữ được
      # qua ba cung, nên nó là lời hứa thật chứ không phải ý định.
      #
      # Khác hai cung trước ở một chỗ, và chỗ đó quan trọng: cung này
      # có runtime Python ở máy ghi vào `assets/js/v/`. Model KHÔNG
      # được đụng thư mục ấy, cũng như không được đụng `phong.js` —
      # sổ tám phòng, tức nội dung.
      - name: Tiến hoá KTG 1/3 — chấm phiếu gốc và ra đề
        id: n-ktg-goc
        if: env.CCOT != '' && contains(steps.kehoach.outputs.han, ',kham-thien-giam-tien-hoa,')
        continue-on-error: true
        timeout-minutes: 3
        run: |
          echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"
          node scripts/tien-hoa.mjs do kham-thien-giam --ghi "$RUNNER_TEMP/ktg-goc.json"
          node scripts/tien-hoa.mjs de-bai kham-thien-giam

      - name: Tiến hoá giao diện Khâm Thiên Giám (Claude Code)
        id: n-ktg-lam
        if: steps.n-ktg-goc.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5
            --max-turns 24
            --allowedTools "Read,Write,Edit,WebFetch"
          prompt: |
            Đọc kham-thien-giam/assets/data/de-bai-tien-hoa.json.

            Trong đó có `phieu` — kết quả chấm cung Khâm Thiên Giám
            theo các thước đo được — và `kyNang`, các kỹ năng chọn từ
            kho Tàng Thư Các khớp với những thước đang trượt.

            Và `luuY` — lời dặn cho những thước mà cách chữa KHÔNG
            nằm ở lớp giao diện. Thước nào có mặt ở đó thì đọc lời
            dặn TRƯỚC khi vá; làm điểm lên bằng cách nó cấm là đang
            tối ưu cho việc che, không phải cho người xem.

            VIỆC CỦA BẠN: làm cung Khâm Thiên Giám tốt lên MỘT BƯỚC,
            đúng một bước.

            Trình tự:
            1. Với mỗi mục trong `kyNang` có trường `doc`, dùng
               WebFetch đọc SKILL.md đó. Đấy là kinh nghiệm người khác
               đã viết ra; đọc trước khi tự nghĩ.
            2. Xem `phieu.diem` — thước nào `dat: false` là điểm yếu
               đo được. Ưu tiên chúng trước.
            3. Nếu mọi thước đều đạt, tìm MỘT chỗ làm trang dễ đọc
               hơn mà không thước nào đo được: nhãn khó hiểu, thứ bậc
               thị giác lẫn lộn, khoảng cách không đều, trạng thái
               trống không nói được gì.

            Chỉ sửa trong ba file này, không file nào khác:
              kham-thien-giam/assets/css/app.css
              kham-thien-giam/assets/js/app.js
              kham-thien-giam/index.html

            LUẬT, đọc kỹ — có cổng chặn tự động sau bạn:
            · MỘT bước thôi. Một thay đổi mạch lạc, không phải năm thứ
              rời rạc. Sửa ít mà đúng hơn sửa nhiều mà loãng.
            · KHÔNG sửa assets/js/phong.js. Đó là sổ tám phòng — luận,
              công thức và bằng chứng đo được, tức NỘI DUNG. Nhiều
              đoạn trong đó ghi lại một bài học đã trả giá; sửa cho
              "gọn" là xoá đúng phần đắt nhất.
            · KHÔNG đụng assets/js/v/. Runtime Python ở máy ghi thư
              mục đó, và nó không chạy trên Actions.
            · KHÔNG đổi cấu trúc dữ liệu, không đổi tên khoá trong
              window.PHONG / window.DAI_CHIEM, không bỏ phòng nào,
              không đổi tuyến hash.
            · KHÔNG thêm thư viện ngoài, không thêm thẻ <script> mới.
              Trang này chạy offline và không có bước dựng.
            · GIỮ mọi aria-label và aria-hidden đang có. Gỡ một nhãn là
              cổng chặn hạ điểm và trả lại toàn bộ việc bạn vừa làm.
            · Màu mới phải đạt tương phản WCAG AA (4.5) trên MỌI nền
              --bg/--bg-2/--card/--card-2/--card-3.

            BA LUẬT RIÊNG CỦA CUNG NÀY, đọc mã nguồn sẽ thấy lặp lại:
            1. Ô nào CHƯA CÓ SỐ thì nói là chưa có, KHÔNG vẽ số 0.
               Cung này giảng về một cỗ máy mà điểm hay của nó là
               không tự tin quá những gì đo được; một giao diện vẽ 0
               cho chỗ chưa đo là phản lại chính điều nó đang giảng.
            2. Thứ ĐO ĐƯỢC và thứ LUẬN RA không bao giờ trông giống
               nhau — số đo đi với chữ máy, phần luận đi chữ thường.
            3. Không có thông tin nào chỉ nằm ở MÀU. Mọi chỗ dùng màu
               đều phải kèm dấu hiệu thứ hai: chữ, dấu, vị trí, bề rộng.

            Cuối cùng, ghi một dòng ngắn nói bạn đã đổi gì và vì sao,
            vào kham-thien-giam/assets/data/de-bai-tien-hoa.json dưới
            khoá `daLam`.

      - name: Cổng chặn KTG — nhận hay trả lại
        id: n-kham-thien-giam-tien-hoa
        if: always() && steps.n-ktg-lam.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          if node scripts/tien-hoa.mjs cong kham-thien-giam --so "$RUNNER_TEMP/ktg-goc.json" 2>&1 | tee "$RUNNER_TEMP/kham-thien-giam-tien-hoa.log"; then
            SW_BAN_TRUOC=$(git diff --name-only -- '*/sw.js')
            node scripts/nang-version.mjs
            git checkout -- $(git diff --name-only -- '*/sw.js' | grep -v '^kham-thien-giam/' | grep -vxF "$SW_BAN_TRUOC" || true)
            echo "::notice::Vòng tiến hoá Khâm Thiên Giám: NHẬN"
          else
            echo "::error::Vòng tiến hoá Khâm Thiên Giám: TRẢ LẠI — cổng chặn không qua"
            git checkout -- kham-thien-giam/
            exit 1
          fi

      - name: Ghi sổ · kham-thien-giam-tien-hoa
        if: always() && steps.n-ktg-goc.outcome != 'skipped'
        env:
          KET: ${{ steps.n-kham-thien-giam-tien-hoa.outcome == 'success' && 'ok' || 'loi' }}
          T_DAU: ${{ steps.n-ktg-goc.outputs.t0 }}
        run: |
          TONG=""
          [ -n "$T_DAU" ] && TONG=$(( $(date +%s) - T_DAU ))
          DIEM=$(grep -oE "phiếu đo [0-9]+/[0-9]+ → [0-9]+/[0-9]+" \
            "$RUNNER_TEMP/kham-thien-giam-tien-hoa.log" 2>/dev/null | tail -1)
          node scripts/nha-may.mjs ghi kham-thien-giam-tien-hoa "$KET" \
            ${TONG:+--giay $TONG} \
            --ghi "${DIEM:-chưa chấm được} · opus-5" \
            --log "$RUNNER_TEMP/kham-thien-giam-tien-hoa.log"


      # ── DÒ KHO TÀNG THƯ CÁC ────────────────────────────────────
      # Nguồn ý tưởng MỚI cho vòng tiến hoá. `tien-hoa.mjs ky-nang`
      # chỉ chọn được kỹ năng hợp với thước ĐANG CÓ, nên nó không bao
      # giờ tìm ra thứ đáng canh mà ta chưa nghĩ tới. Node này lục cả
      # 3.696 kỹ năng, bỏ những cái đã khai thác, và tải vài ứng viên
      # đầu bảng về kèm trích dẫn.
      #
      # Nhịp 168 giờ (một tuần) nên phần lớn lượt chạy nó bị bỏ qua —
      # đúng ý: kho chỉ được quét lại vài lượt mỗi ngày, dò mỗi 6 giờ
      # là 28 lượt tải cho cùng một danh sách không đổi.
      #
      # Trần 4 phút: sáu lời gọi raw.githubusercontent nối đuôi, mỗi
      # cái timeout 30 giây.
      - name: Dò kho Tàng Thư Các
        id: n-do-kho
        if: contains(steps.kehoach.outputs.han, ',do-kho,')
        continue-on-error: true
        timeout-minutes: 4
        run: |
          t0=$(date +%s)
          node scripts/do-kho.mjs quet 2>&1 | tee "$RUNNER_TEMP/do-kho.log"
          echo "giay=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
      - name: Ghi sổ · do-kho
        if: always() && steps.n-do-kho.outcome != 'skipped'
        env:
          KET: ${{ steps.n-do-kho.outcome == 'success' && 'ok' || 'loi' }}
          GIAY: ${{ steps.n-do-kho.outputs.giay }}
        run: |
          UV=$(grep -oE "[0-9]+ ứng viên chưa khai thác" "$RUNNER_TEMP/do-kho.log" 2>/dev/null | tail -1)
          node scripts/nha-may.mjs ghi do-kho "$KET" \
            ${GIAY:+--giay $GIAY} \
            --ghi "${UV:-chưa quét được}" \
            --log "$RUNNER_TEMP/do-kho.log"

      # PHIẾU TOÀN THÀNH. Chỉ bốn cung có vòng tiến hoá gọi tới
      # `tien-hoa.mjs do`; tám cung còn lại chưa từng được chấm trong
      # một lượt bot nào. Bước này chấm cả mười hai bằng ĐÚNG bộ thước
      # đó rồi ghi factory/phieu.json.
      #
      # Không gọi model. Cả mười hai cung xong trong ~8 giây ở máy,
      # nên trần 6 phút là rất rộng — để rộng vì máy ảo Actions chậm
      # hơn, và vì mỗi cung phải dựng DOM giả rồi nạp app.js của nó.
      - name: Phiếu toàn thành
        id: n-phieu
        if: contains(steps.kehoach.outputs.han, ',phieu,')
        continue-on-error: true
        timeout-minutes: 6
        run: |
          t0=$(date +%s)
          node scripts/phieu-toan-thanh.mjs 2>&1 | tee "$RUNNER_TEMP/phieu.log"
          echo "giay=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
      - name: Ghi sổ · phieu
        if: always() && steps.n-phieu.outcome != 'skipped'
        env:
          KET: ${{ steps.n-phieu.outcome == 'success' && 'ok' || 'loi' }}
          GIAY: ${{ steps.n-phieu.outputs.giay }}
        run: |
          TT=$(grep -oE "[0-9]+/[0-9]+ thước đạt trên [0-9]+ cung" "$RUNNER_TEMP/phieu.log" 2>/dev/null | tail -1)
          node scripts/nha-may.mjs ghi phieu "$KET"             ${GIAY:+--giay $GIAY}             --ghi "${TT:-chưa chấm được}"             --log "$RUNNER_TEMP/phieu.log"

      - name: Kiểm hàng trước khi đóng gói
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/nha-may.mjs kiem-hang

      # ── M18 · Xưởng học lại ─────────────────────────────────────
      # ĐẶT CUỐI CÙNG, sau cả bản quét lẫn máy kiểm — và đó là chỗ đã
      # sai một lượt. Lượt #15 bước này chạy TRƯỚC bản quét, nên báo
      # cáo kết luận "dai-quan-trac chưa có lượt chạy thật nào" trong
      # khi node ấy đang chạy ở bước ngay sau. Báo cáo đọc sổ, nên nó
      # phải là thứ chạy sau khi sổ đã ghi xong.
      #
      # Claude Code Action đọc sổ ghi rồi viết vài dòng tiếng Việt về
      # sức khoẻ xưởng. Ba điều đáng nói:
      #
      # 1. CLAUDE_CODE_OAUTH_TOKEN chứ không phải ANTHROPIC_API_KEY.
      #    Token này tạo bằng `claude setup-token` ở máy và trả bằng
      #    QUOTA GÓI CLAUDE thay vì tính tiền theo token. Đó là cả lý
      #    do bước này tồn tại được: nhịp quét cũ của Đài Quan Trắc
      #    tốn 170 USD/tháng và đã phải tắt.
      #    Đổi lại, nó ăn vào QUOTA BẠN ĐANG NGỒI DÙNG. Nên phải cân
      #    theo khối lượng thật của việc, chứ không theo cảm giác
      #    "model to thì đắt".
      #
      #    Việc này nhỏ và cố định: đọc hai file JSON (~25 KB) rồi
      #    viết 15 dòng, một lượt mỗi ngày, --max-turns 8 chặn trần.
      #    Ở khối lượng đó Opus 5 không đáng kể so với một buổi ngồi
      #    làm việc bình thường — nên dùng Opus, vì phần giá trị nhất
      #    của báo cáo là câu "nên xem chỗ nào trước", và đó đúng là
      #    chỗ model mạnh hơn thấy rõ hơn.
      #
      #    Khác hẳn bản QUÉT Đài Quan Trắc ở bước trên: chỗ đó
      #    WebSearch kéo nguyên nội dung trang vào ngữ cảnh, nhân sáu
      #    chiến trường, nên khối lượng phình không chặn được. Chỗ đó
      #    giữ Haiku. Từ 15/08 cả hai cùng trả bằng quota, nên khác
      #    biệt còn lại đúng là khối lượng — không phải đường tiền.
      #
      # 2. CHỈ Read và Write. Không Bash, không git. Claude viết đúng
      #    một file rồi thôi; bước commit bên dưới mới là chỗ đẩy đi.
      #    Để nó tự commit là hai nguồn cùng ghi vào một repo trong
      #    một job — đúng loại đua mà cả CLAUDE.md tránh.
      #
      # 3. Thiếu secret thì BỎ QUA êm, không ngã. Ngày dựng bước này
      #    secret chưa tồn tại; một workflow đỏ vì thiếu thứ chưa ai
      #    tạo thì lần đỏ thật sau đó không ai buồn nhìn.
      #    Tạo secret: chạy `claude setup-token` ở máy, rồi dán vào
      #    Settings → Secrets → Actions → CLAUDE_CODE_OAUTH_TOKEN.
      - name: Bấm giờ · trước khi báo cáo
        id: gio-bc-0
        if: env.CCOT != '' && contains(steps.kehoach.outputs.han, ',bao-cao,')
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Báo cáo sức khoẻ xưởng (Claude Code)
        id: n-bao-cao
        if: env.CCOT != '' && contains(steps.kehoach.outputs.han, ',bao-cao,')
        continue-on-error: true
        timeout-minutes: 6
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5
            --max-turns 8
            --allowedTools "Read,Write"
          prompt: |
            Đọc factory/state.json và factory/registry.json trong repo này.
            Đó là sổ vận hành của một hệ sinh thái 7 webapp tĩnh: mỗi "node"
            là một bước tự động chạy theo nhịp, `ket` là kết quả lượt gần
            nhất (ok/loi), `chuoiLoi` là số lượt ngã liên tiếp, `nhip` là số
            giờ giữa hai lượt.

            Viết đè file factory/bao-cao.md, TIẾNG VIỆT, tối đa 15 dòng:

            1. Một câu tổng: xưởng đang khoẻ hay đang có chuyện.
            2. Node nào đáng lo và VÌ SAO — ưu tiên `chuoiLoi` >= 2, rồi
               tới node trễ quá gấp đôi `nhip` của nó.
            3. Node nào chạy đều nhưng `lucDoi` đã lâu không đổi — nghĩa là
               nó chạy được mà nguồn dữ liệu phía sau có thể đã chết.
            4. Đúng một việc nên làm trước.

            Không suy đoán ngoài dữ liệu trong hai file đó. Không có gì
            đáng lo thì nói thẳng là không có, đừng bịa ra việc.
            Chỉ ghi file, không chạy lệnh nào khác.

            MỘT ĐIỀU BẠN KHÔNG THẤY ĐƯỢC, và nó đã làm bạn báo sai một
            lần: bạn chạy Ở GIỮA lượt, không phải cuối. Vài node nằm sau
            bước này trong cùng một job, nên state.json bạn đọc CHƯA có
            lượt của chúng.

            Vì vậy: một node khai `nhip` mà KHÔNG có dòng nào trong
            state.json thì đừng kết luận "chưa từng được gọi". Đó là
            hình dạng của một node mới, chạy sau bạn, và sẽ ghi sổ vài
            giây nữa. Ngày 29/08 bạn đã đặt đúng câu ấy vào ô "việc nên
            làm trước" cho `tri-thuc` và `tri-thuc-tien-hoa` — cả hai
            ghi sổ đúng 0,2 giây và 3 phút sau khi bạn viết xong.

            Node vắng mặt hoàn toàn thì cứ nêu, nhưng nêu như một điều
            CẦN KIỂM, và đừng dùng nó làm "việc nên làm trước" khi còn
            chỗ nào đáng hơn. Ô đó chỉ có một suất; tiêu nó vào một báo
            động sai là lượt ấy không nói được gì thật.
      # Bấm giờ SAU nằm luôn trong bước ghi sổ, không tách riêng: đây
      # là bước `run:` đầu tiên chạy sau action, và nó có `always()`
      # nên đo được cả lượt ngã. Node dai-quan-trac phải tách riêng vì
      # giữa quét và ghi sổ của nó còn hai bước khác xen vào.
      - name: Ghi sổ · bao-cao
        if: always() && steps.n-bao-cao.outcome != 'skipped'
        env:
          KET: ${{ steps.n-bao-cao.outcome == 'success' && 'ok' || 'loi' }}
          T0: ${{ steps.gio-bc-0.outputs.t }}
        run: |
          GIAY=""
          [ -n "$T0" ] && GIAY=$(( $(date +%s) - T0 ))
          node scripts/nha-may.mjs ghi bao-cao "$KET" ${GIAY:+--giay $GIAY} \
            --ghi "opus-5 · max-turns 8"

      # ── M12 · Lát cắt tri thức ──────────────────────────────────
      # Thuần script, không gọi model. Dựng lại 11 lát cắt từ
      # knowledge-os/data/ để trang nói đúng bản dữ liệu hiện tại.
      #
      # `sinh.mjs` tự chạy validator trước và KHÔNG ghi gì nếu dữ liệu
      # sai — cùng luật với build-scan.mjs: một dòng sai ở đây không
      # nằm yên trong file JSON, nó thành chữ trên trang người ta đọc.
      # Nó cũng bỏ qua cung nào nội dung không đổi, nên lượt không có
      # gì mới thì không sinh ra một commit rỗng.
      - name: Lát cắt tri thức
        id: n-tri-thuc
        if: contains(steps.kehoach.outputs.han, ',tri-thuc,')
        continue-on-error: true
        timeout-minutes: 3
        run: |
          t0=$(date +%s)
          node knowledge-os/sinh.mjs 2>&1 | tee "$RUNNER_TEMP/tri-thuc.log"
          echo "giay=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
      - name: Ghi sổ · tri-thuc
        if: always() && steps.n-tri-thuc.outcome != 'skipped'
        env:
          KET: ${{ steps.n-tri-thuc.outcome == 'success' && 'ok' || 'loi' }}
          GIAY: ${{ steps.n-tri-thuc.outputs.giay }}
        run: node scripts/nha-may.mjs ghi tri-thuc "$KET" ${GIAY:+--giay $GIAY} --log "$RUNNER_TEMP/tri-thuc.log"

      # ── M18 · Tiến hoá lớp tri thức ─────────────────────────────
      # Vòng thứ năm của xưởng, và là vòng đầu tiên KHÔNG sửa giao
      # diện: bốn vòng kia vá app.css/app.js, vòng này vá chính lớp
      # tri thức.
      #
      # Cùng khuôn ba lớp với bốn vòng kia — đo TRƯỚC, model ở giữa,
      # cổng chặn chấm lại SAU — nhưng phiếu đo là của riêng nó:
      # `knowledge-os/do.mjs`, bảy thước về độ phủ và độ truy ngược
      # được. Không dùng `tien-hoa.mjs` vì thước ở đó đo giao diện.
      #
      # PHẠM VI HẸP HƠN MỌI VÒNG KHÁC, và cố ý: model chỉ được chạm
      # lớp phân tích (cầu nối) và lớp 2026. Lớp SÁCH cấm tuyệt đối —
      # nó cần người có PDF trong tay, còn một model đoán một số trang
      # nằm đúng khoảng chương thì qua được MỌI phép kiểm mà vẫn là
      # trích dẫn bịa. Cổng chặn không bắt được chuyện đó, nên chặn ở
      # phạm vi chứ không chặn ở kết quả.
      - name: Ra đề tiến hoá — tri thức
        id: n-tt-de
        if: env.CCOT != '' && contains(steps.kehoach.outputs.han, ',tri-thuc-tien-hoa,')
        continue-on-error: true
        timeout-minutes: 4
        run: |
          node knowledge-os/do.mjs --ghi "$RUNNER_TEMP/tt-goc.json"
          node knowledge-os/do.mjs de-bai --ra "$GITHUB_OUTPUT"

      - name: Đánh dấu mốc trước khi sửa
        id: n-tt-moc
        if: steps.n-tt-de.outcome == 'success'
        run: |
          # Chụp danh sách file ĐÃ BẨN SẴN, không chỉ `rev-parse HEAD`.
          # Node `tri-thuc` chạy TRƯỚC bước này trong CÙNG một lượt và
          # đã ghi lát cắt mà chưa commit; so với HEAD thì phép soát
          # phạm vi sẽ luôn thấy chúng nằm ngoài và luôn trả lại. Đúng
          # cái bẫy đã giết vòng Đài Quan Trắc chín lượt liền.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git diff --name-only -- knowledge-os > "$RUNNER_TEMP/tt-ban-truoc.txt"

      # Không còn điểm yếu thì KHÔNG gọi model. Bảy thước hết chỗ đo là
      # chuyện tốt, không phải lý do đi tìm việc cho model.
      - name: Đề xuất bản vá tri thức (Claude Code)
        id: n-tt-va
        if: steps.n-tt-de.outcome == 'success' && steps.n-tt-de.outputs.yeu != '0'
        continue-on-error: true
        timeout-minutes: 12
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5
            --max-turns 20
            --allowedTools "Read,Write,Edit"
          prompt: |
            Đọc knowledge-os/data/de-bai-tien-hoa.json.

            Trong đó có:
            · `phieu.diem` — các thước, mỗi cái có `dat` và `y` (số đo
              cụ thể). Thước nào `dat: false` là điểm yếu. ĐỪNG đoán
              số thước; đọc hết mảng.
            · `chuaAnhXa` — phòng có thật trong mã nguồn cung mà lớp
              tri thức chưa nói gì về nó. Rỗng là chuyện bình thường.
            · `chuaPhanQuyet2026` — khái niệm SÁCH chưa có dòng nào nói
              từ 2018 tới nay chuyện gì đã xảy ra với nó.
            · `khaiNiemDungDuoc` — TOÀN BỘ id khái niệm được phép dùng.
            · `duocSua` / `camSua` — đọc kỹ hai danh sách này.

            VIỆC CỦA BẠN: làm lớp tri thức tốt lên MỘT BƯỚC, đúng một
            bước. Chọn điểm yếu có số đo tệ nhất và sửa duy nhất nó.

            Cách sửa thường gặp nhất — phòng chưa ánh xạ:
            đọc mã nguồn cung để hiểu phòng đó LÀM GÌ, rồi hoặc

              (a) thêm vào `rooms` của cung trong
                  knowledge-os/data/bridges/repo.json:
                  { "id": "<mã phòng>", "name_vi": "...",
                    "concepts": ["<id có sẵn>", ...],
                    "note_vi": "<một hai câu nói phòng này đang đo
                                VIỆC KINH TẾ nào>" }

              hoặc (b) nếu phòng đó là công cụ thuần tuý — trang tra
                  từ, xưởng ảnh, danh mục dự án — thì thêm vào
                  `rooms_skipped` kèm `why_vi` nói vì sao. Bỏ qua có
                  lý do là một câu trả lời ĐÚNG, không phải né việc.

            Cách sửa khi điểm yếu là `phan-quyet-2026` — và đây là
            trường hợp thường gặp khi `chuaAnhXa` rỗng:

            Chọn MỘT khái niệm trong `chuaPhanQuyet2026` mà bạn thật sự
            đọc được bằng chứng trong repo, rồi thêm vào
            knowledge-os/data/2026/relations.json một quan hệ:

              { "from": "<id khái niệm 2026>",
                "relation": "supports" | "challenges" | "extends" | "carries",
                "to": "<id khái niệm sách>",
                "reason_vi": "<từ 2018 tới nay chuyện gì đã xảy ra với
                              khái niệm ấy, và vì sao đó là supports hay
                              challenges>",
                "source_type": "repo",
                "source_ref": "<đường CÓ THẬT trong repo>",
                "confidence": "high" | "medium" | "low" }

            Chưa có khái niệm 2026 nào hợp thì thêm một cái vào
            knowledge-os/data/2026/concepts.json trước:

              { "id": "<id mới, không trùng lớp sách>",
                "label_en": "...", "label_vi": "...",
                "kind": "...", "definition_vi": "...",
                "stance": "repo", "source_type": "repo",
                "source_ref": "<đường CÓ THẬT>", "observed": "2026-08",
                "tags": ["2026"] }

            Thà MỘT phán quyết viết chắc còn hơn năm cái viết cho đủ
            số: cổng chặn không đo được chất lượng câu chữ, nên chỗ đó
            chỉ có bạn giữ.

            Nếu không có điểm yếu nào bạn sửa được một cách trung thực
            thì ĐỪNG sửa bừa — nói ra là không sửa gì. Một lượt không
            đổi gì tốt hơn một dòng bịa.

            LUẬT CỨNG, vi phạm là cổng chặn trả lại cả bản vá:
            · Chỉ sửa file trong `duocSua`. Không chạm `camSua`.
            · Chỉ dùng id khái niệm có trong `khaiNiemDungDuoc`.
            · Không thêm `source_chapters` / `source_pages` cho bất cứ
              thứ gì. Chương và trang chỉ người đọc sách mới đặt được.
            · Khái niệm 2026 phải có `source_ref` trỏ vào một đường
              CÓ THẬT trong repo. Đường không tồn tại là trích dẫn bịa.
            · `note_vi` phải nói được điều mà TÊN PHÒNG không nói. Chép
              lại tên phòng thành câu là không thêm gì cả.

            Chỉ sửa file. Không chạy lệnh nào.

      - name: Cổng chặn tri thức — nhận hay trả lại
        id: n-tt-cong
        if: always() && steps.n-tt-va.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 5
        env:
          MOC: ${{ steps.n-tt-moc.outputs.sha }}
        run: |
          BAN_TRUOC="$RUNNER_TEMP/tt-ban-truoc.txt"
          [ -f "$BAN_TRUOC" ] || : > "$BAN_TRUOC"
          MOI=$(git diff --name-only "$MOC" -- knowledge-os | grep -vxF -f "$BAN_TRUOC" || true)
          # de-bai-tien-hoa.json đã gitignore nên nó không bao giờ hiện
          # trong "git diff" — không cần khai ở đây.
          CHO='knowledge-os/data/bridges/repo.json knowledge-os/data/2026/concepts.json knowledge-os/data/2026/relations.json'
          NGOAI=''
          for f in $MOI; do
            case " $CHO " in *" $f "*) ;; *) NGOAI="$NGOAI $f" ;; esac
          done
          if [ -n "$NGOAI" ]; then
            echo "::error::Bản vá tri thức chạm file ngoài phạm vi:$NGOAI"
            if [ -n "$MOI" ]; then git checkout -- $MOI; fi
            exit 1
          fi
          if node knowledge-os/do.mjs cong --so "$RUNNER_TEMP/tt-goc.json" 2>&1 \
               | tee "$RUNNER_TEMP/tri-thuc-tien-hoa.log"; then
            echo "::notice::Vòng tiến hoá tri thức: NHẬN"
          else
            echo "::error::Vòng tiến hoá tri thức: TRẢ LẠI — cổng chặn không qua"
            HONG=$(git diff --name-only "$MOC" -- knowledge-os | grep -vxF -f "$BAN_TRUOC" || true)
            if [ -n "$HONG" ]; then git checkout -- $HONG; fi
            exit 1
          fi

      - name: Ghi sổ · tri-thuc-tien-hoa
        if: always() && steps.n-tt-de.outcome != 'skipped'
        env:
          # Phiếu đầy đủ (không gọi model) cũng là `ok`: node đã chạy,
          # đã đo, và kết luận đúng là không có gì phải sửa.
          KET: ${{ (steps.n-tt-de.outputs.yeu == '0' || steps.n-tt-cong.outcome == 'success') && 'ok' || 'loi' }}
          YEU: ${{ steps.n-tt-de.outputs.yeu }}
          T_DAU: ${{ steps.n-tt-de.outputs.t0 }}
        run: |
          TONG=""
          [ -n "$T_DAU" ] && TONG=$(( $(date +%s) - T_DAU ))
          node scripts/nha-may.mjs ghi tri-thuc-tien-hoa "$KET" \
            ${TONG:+--giay $TONG} \
            --ghi "${YEU:-?} điểm yếu · opus-5 · cổng chặn quyết định" \
            --log "$RUNNER_TEMP/tri-thuc-tien-hoa.log"

      # ── VÒNG TIẾN HOÁ XOAY · bảy cung dùng chung một node ──────
      # Năm cung có vòng riêng chạy mỗi ngày. Bảy cung còn lại không
      # có gì cả. Thêm bảy node nữa là thêm ~21 phút model mỗi lượt và
      # đệm ngân sách tụt từ 4× xuống 2,4× — dưới ngưỡng `npm run kiem`
      # đòi. Nên xoay: mỗi ngày một cung, bảy ngày giáp vòng, chi phí
      # bằng một vòng. Danh sách và lý do đầy đủ ở scripts/vong-xoay.mjs.
      #
      # Chỉ khác các vòng riêng ở MỘT chỗ: tên cung là biến. Mọi thứ
      # còn lại — đo trước, ra đề, model, cổng chặn, hoàn nguyên — đi
      # đúng đường đã có.
      - name: Chọn cung — vòng xoay
        id: n-xv-chon
        if: env.CCOT != '' && contains(steps.kehoach.outputs.han, ',tien-hoa-xoay,')
        timeout-minutes: 1
        run: |
          echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"
          node scripts/tien-hoa.mjs xoay --ra "$GITHUB_OUTPUT"

      - name: Ra đề — vòng xoay
        id: n-xv-de
        if: steps.n-xv-chon.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          C: ${{ steps.n-xv-chon.outputs.cung }}
        run: |
          node scripts/tien-hoa.mjs do "$C" --ghi "$RUNNER_TEMP/xv-goc.json"
          node scripts/tien-hoa.mjs de-bai "$C"
          node scripts/tien-hoa.mjs tom-tat "$C" --ra "$GITHUB_OUTPUT"
          # Chụp danh sách file ĐÃ BẨN SẴN trước khi model chạm vào.
          # Bốn trong bảy cung này có node dữ liệu nhịp 6 giờ chạy
          # TRƯỚC bước này trong cùng lượt; `git checkout -- <cung>/`
          # lúc trả lại sẽ cuốn theo cả số liệu vừa lấy về, và một lượt
          # tiến hoá trượt thành một lượt MẤT SỐ LIỆU mà không dòng log
          # nào nói ra. Vòng Đài Quan Trắc đã cắn đúng chỗ này.
          git diff --name-only -- "$C" > "$RUNNER_TEMP/xv-ban-truoc.txt"

      # KHÔNG chặn ở `yeu != '0'` như năm vòng riêng. Đo ngày 29/08:
      # cả mười hai cung đều tròn phiếu, nên điều kiện ấy làm TOÀN BỘ
      # hệ tiến hoá ngủ — năm vòng riêng cũng đang ngủ vì đúng lý do
      # này, chỉ là không ai thấy vì sổ vẫn ghi "ok".
      #
      # Phiếu đầy không có nghĩa là trang đã tốt; nó có nghĩa là các
      # thước hiện có không còn thấy gì. Đề bài có sẵn bước 3 cho đúng
      # tình huống này: tìm MỘT chỗ đọc dễ hơn mà không thước nào đo
      # được. Cổng chặn vẫn đứng sau, và chốt "không được xấu đi" vẫn
      # khoá mọi chiều ĐO ĐƯỢC.
      #
      # Nói thẳng cái nó KHÔNG khoá: bố cục xấu đi, chữ nghĩa dở đi.
      # Đổi lại là mỗi cung một bước mỗi tuần, và mỗi bước là một
      # commit người đọc được và hoàn lại được.
      - name: Đề xuất bản vá — vòng xoay (Claude Code)
        id: n-xv-va
        if: steps.n-xv-de.outcome == 'success'
        # BẮT BUỘC, và tôi đã quên nó ở bản đầu — trả giá ngay lượt
        # đầu tiên: lượt 10:10Z ngày 29/08 hết quota, bước này ngã sau
        # 15 giây, và vì không có dòng này nó kéo ĐỎ cả job. Deploy bị
        # bỏ qua, tức là một lượt tiến hoá hỏng đã chặn luôn đường dữ
        # liệu của mười hai cung.
        #
        # Cả tám bước claude-code-action khác trong file này đều có
        # dòng này. Đó không phải thói quen — đó là luật: model là
        # phần DUY NHẤT của xưởng có thể hỏng vì lý do ngoài repo
        # (hết quota, mạng, API đổi), nên nó phải là phần không bao
        # giờ được phép kéo theo ai.
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5
            --max-turns 24
            --allowedTools "Read,Write,Edit,WebFetch"
          prompt: |
            Cung của lượt này là: ${{ steps.n-xv-chon.outputs.cung }}
            Dưới đây gọi nó là <cung>.

            Đọc <cung>/assets/data/de-bai-tien-hoa.json.

            Trong đó có `phieu` — kết quả chấm cung theo các thước đo
            được — và `kyNang`, các kỹ năng chọn từ kho Tàng Thư Các.
            Mục nào có `moi: true` là ứng viên MỚI dò được, chưa cung
            nào dùng: đọc, nhưng chỉ áp dụng nếu nó thật sự hợp cung
            này. Và `luuY` — lời dặn cho những thước mà cách chữa
            KHÔNG nằm ở lớp giao diện; thước nào có mặt ở đó thì đọc
            lời dặn TRƯỚC khi vá.

            VIỆC CỦA BẠN: làm cung này tốt lên MỘT BƯỚC, đúng một
            bước.

            Trình tự:
            1. Với mỗi mục trong `kyNang` có trường `doc`, dùng
               WebFetch đọc SKILL.md đó. Đấy là kinh nghiệm người khác
               đã viết ra; đọc trước khi tự nghĩ.
            2. Xem `phieu.diem` — thước nào `dat: false` là điểm yếu
               đo được. Ưu tiên chúng trước.
            3. Nếu mọi thước đều đạt, tìm MỘT chỗ làm trang dễ đọc hơn
               mà không thước nào đo được: nhãn khó hiểu, thứ bậc thị
               giác lẫn lộn, khoảng cách không đều, trạng thái trống
               không nói được gì.

            Chỉ sửa trong ba file này, không file nào khác:
              <cung>/assets/css/app.css
              <cung>/assets/js/app.js
              <cung>/index.html
            (thay <cung> bằng tên ở dòng đầu)

            LUẬT, đọc kỹ — có cổng chặn tự động sau bạn:
            · MỘT bước thôi. Một thay đổi mạch lạc, không phải năm thứ
              rời rạc. Sửa ít mà đúng hơn sửa nhiều mà loãng.
            · KHÔNG đổi cấu trúc dữ liệu, không đổi tên khoá trong
              các biến window.*, không bỏ phòng nào, không đổi tuyến
              hash.
            · GIỮ mọi aria-label và aria-hidden đang có. Gỡ một nhãn
              là cổng chặn hạ điểm và trả lại toàn bộ việc bạn vừa làm.
            · MỖI id chỉ được xuất hiện MỘT lần trong trang. Trình
              duyệt lấy thẻ đầu tiên, nên gắn trùng một id là làm thẻ
              còn lại vô hình với JS. Ngày 29/08 đúng lỗi này thổi bay
              đỉnh trang và chân trang của bốn cung, mà phiếu đo vẫn
              xanh vì phòng vẫn vẽ ra — chỉ vào nhầm thẻ.
            · Màu mới phải đạt tương phản WCAG AA (4.5) trên mọi nền.
            · KHÔNG thêm thư viện ngoài, không thêm thẻ <script> mới.
              Trang chạy offline và không có bước dựng.
            · ĐỪNG đụng vào <cung>/assets/js/v/ và <cung>/assets/data/
              — bot số liệu ghi hai chỗ đó, sửa tay là mất lúc gộp.

            Cuối cùng, ghi một dòng ngắn nói bạn đã đổi gì và vì sao,
            vào <cung>/assets/data/de-bai-tien-hoa.json dưới khoá
            `daLam`. Đừng để chữ "undefined" hay "NaN" lọt vào dòng đó
            — cổng chặn soi hai chữ ấy trong HTML và sẽ trả lại.

      - name: Cổng chặn — vòng xoay
        id: n-tien-hoa-xoay
        if: always() && steps.n-xv-va.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 5
        env:
          C: ${{ steps.n-xv-chon.outputs.cung }}
        run: |
          if node scripts/tien-hoa.mjs cong "$C" --so "$RUNNER_TEMP/xv-goc.json" 2>&1 \
               | tee "$RUNNER_TEMP/tien-hoa-xoay.log"; then
            SW_BAN_TRUOC=$(git diff --name-only -- '*/sw.js')
            node scripts/nang-version.mjs
            git checkout -- $(git diff --name-only -- '*/sw.js' | grep -v "^$C/" | grep -vxF "$SW_BAN_TRUOC" || true)
            echo "::notice::Vòng tiến hoá xoay ($C): NHẬN"
          else
            echo "::error::Vòng tiến hoá xoay ($C): TRẢ LẠI — cổng chặn không qua"
            # Chỉ trả lại đúng thứ bước NÀY làm bẩn, không cuốn theo số
            # liệu bot vừa ghi trong cùng lượt.
            HONG=$(git diff --name-only -- "$C" | grep -vxF -f "$RUNNER_TEMP/xv-ban-truoc.txt" || true)
            if [ -n "$HONG" ]; then git checkout -- $HONG; fi
            exit 1
          fi

      - name: Ghi sổ · tien-hoa-xoay
        if: always() && steps.n-xv-chon.outcome != 'skipped'
        env:
          # Model ngã thì node LỖI, dù cổng chặn có qua.
          #
          # Bản đầu chỉ đọc kết cục của cổng chặn. Lượt 10:10Z ngày
          # 29/08 cho thấy chỗ hổng ngay: model ngã vì hết quota,
          # KHÔNG có bản vá nào được sinh ra, cổng chặn chấm lại thấy
          # 17/17 → 17/17 nên qua, và sổ ghi `ok`. Chú thích có nói
          # "ngã ở MODEL" nhưng `ket` mới là thứ bộ đếm chuỗi lỗi và
          # báo cáo sức khoẻ đọc.
          #
          # Một vòng tiến hoá chết vì hết quota mà mỗi ngày vẫn ghi
          # "ok" thì đúng bằng thứ CLAUDE.md gọi là "vòng đã dựng xong
          # mà nằm im, tệ hơn một vòng chưa dựng vì nhìn vào sổ thì nó
          # có vẻ đang chạy".
          KET: ${{ (steps.n-xv-va.outcome == 'success' && steps.n-tien-hoa-xoay.outcome == 'success') && 'ok' || 'loi' }}
          C: ${{ steps.n-xv-chon.outputs.cung }}
          YEU: ${{ steps.n-xv-de.outputs.yeu }}
          T_DAU: ${{ steps.n-xv-chon.outputs.t0 }}
          KC_DE: ${{ steps.n-xv-de.outcome }}
          KC_VA: ${{ steps.n-xv-va.outcome }}
          KC_CONG: ${{ steps.n-tien-hoa-xoay.outcome }}
        run: |
          TONG=""
          [ -n "$T_DAU" ] && TONG=$(( $(date +%s) - T_DAU ))
          # Tên cung ĐỨNG ĐẦU: sổ này gộp bảy cung vào một dòng mỗi
          # ngày, nên không có tên thì cả cột chuThich vô nghĩa.
          NGA=""
          if [ "$KC_DE" != "success" ] && [ "$KC_DE" != "skipped" ]; then
            NGA="ngã ở RA ĐỀ ($KC_DE) — model chưa hề chạy"
          elif [ "$KC_VA" = "failure" ]; then
            NGA="ngã ở MODEL"
          elif [ "$KC_CONG" = "failure" ]; then
            NGA="cổng chặn TRẢ LẠI"
          fi
          DIEM=$(grep -oE "phiếu đo [0-9]+/[0-9]+ → [0-9]+/[0-9]+" \
            "$RUNNER_TEMP/tien-hoa-xoay.log" 2>/dev/null | tail -1)
          node scripts/nha-may.mjs ghi tien-hoa-xoay "$KET" \
            ${TONG:+--giay $TONG} \
            --ghi "${C:-?}: ${NGA:+$NGA · }${DIEM:-${YEU:-?} điểm yếu} · opus-5" \
            --log "$RUNNER_TEMP/tien-hoa-xoay.log"

      - name: Chiếu sổ sang Bảng vận hành
        if: always()
        run: node scripts/nha-may.mjs chieu

      # ── M18b · Học xong thì phải làm gì đó ──────────────────────
      # Nửa còn thiếu của "xưởng học lại". `bao-cao.md` ở bước trên là
      # thứ để ĐỌC — mà lúc xưởng ốm thì thường chẳng ai mở repo ra
      # đọc. Bước này để KHÔNG PHẢI đọc mới biết: node ốm thì tự mở
      # một việc trên GitHub, hết ốm thì tự đóng lại.
      #
      # KHÔNG gọi model. Chẩn đoán ở đây là so số với ngưỡng trong
      # nha-may.mjs — cùng lối với build-quantrac.mjs. Chỗ nào số học
      # trả lời được thì đừng trả tiền cho model trả lời.
      #
      # Một việc duy nhất, sửa đi sửa lại. Mở việc mới mỗi lượt thì
      # tám lượt/ngày thành hơn năm chục việc một tuần nói cùng một
      # chuyện, và người ta tắt thông báo — cảnh báo tự huỷ chính nó.
      # Bước này chạy MỌI lượt thức dậy (không có `nhip` chặn), nên
      # thêm mốc cron là thêm thẳng vào con số đó.
      - name: Mở việc nếu có node ốm
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/nha-may.mjs canh-bao

      - name: Commit nếu có thay đổi
        timeout-minutes: 3
        id: commit
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Bước này ngã năm lượt liền (#10–#14) mà không ai đọc được lý
          # do: tải log Actions qua API thì phải đăng nhập, còn ANNOTATION
          # thì đọc được từ ngoài, không cần khoá. Nên ở đây mọi lỗi tự
          # khai ra annotation — lần sau nhìn thẳng trang Summary là thấy
          # dòng nào ngã, thay vì đoán qua mã thoát.
          trap 'echo "::error::Bước commit ngã ở dòng $LINENO"' ERR

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ── ĐẶT LẠI KHOÁ ĐẨY — nguyên nhân thật của #10–#14 ──────
          # `actions/checkout` có lưu sẵn khoá vào .git/config, nên
          # đáng lẽ `git push` chạy được mà không cần làm gì thêm.
          # Nhưng `anthropics/claude-code-action` dựng lại cấu hình
          # git của riêng nó, và khoá ấy mất. Bước này chạy SAU nó,
          # nên tới lúc đẩy thì repo không còn ai để xưng tên:
          #
          #   remote: Invalid username or token.
          #   fatal: Authentication failed for '…/blockchainworld.git/'
          #
          # Dấu vết khớp đúng: lượt #10 bước Claude bị skip thì chết ở
          # `git add`; #11–#14 bước Claude có chạy thì chết ở `git push`.
          # Bốn lượt đầu chỉ để lại mã thoát nên đã đoán nhầm hai lần
          # (tưởng non-fast-forward, rồi tưởng clone nông).
          #
          # Nên ĐỪNG tin vào khoá đã lưu: tự đặt lại, mỗi lượt. Rẻ, và
          # không phụ thuộc vào việc action nào đó có tử tế hay không.
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # ── Cái gì đáng commit: HỎI SỔ, đừng chép tay ──────────
          # Trước đây chỗ này là ~25 đường dẫn viết tay, và phải khớp
          # với `ra` của node lẫn danh sách trong CLAUDE.md. Ba nơi,
          # không nơi nào bắt nơi nào — bẫy đó đã cắn hai lần: thư mục
          # logo bị sót nên ảnh vỡ trên site; rồi `assets/data/` gom
          # quá rộng nên nuốt cả bản dịch viết tay.
          #
          # Nay danh sách sinh từ sổ đăng ký. Muốn đổi phạm vi thì sửa
          # `ra` của node trong scripts/node/<cung>.mjs — một chỗ.
          #
          # `duong-ra` chỉ in đường DẪN CÓ THẬT trên đĩa. Nhờ vậy cả
          # lớp lỗi "pathspec did not match any files" biến mất — thứ
          # đã giết các lượt #10–#14 ngày 15/08 vì factory/bao-cao.md
          # chưa từng tồn tại.
          node scripts/nha-may.mjs duong-ra > "$RUNNER_TEMP/duong-ra.txt"
          echo "Sổ khai $(wc -l < "$RUNNER_TEMP/duong-ra.txt") đường dẫn đáng commit."
          git add --pathspec-from-file="$RUNNER_TEMP/duong-ra.txt"
          if git diff --staged --quiet; then
            echo "Không node nào đến hạn hoặc số liệu không đổi — không commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: cập nhật số liệu $(date -u +%d/%m/%Y' '%H:%M) UTC"
          # Lượt này dài — 8 tới 15 phút, mà Tàng Thư Các một mình đã có
          # lượt 532 giây. Trong ngần ấy thời gian, người ngồi máy push
          # xen vào là chuyện thường, và sáng 15/08 thì rất dày: 6 commit
          # trong 40 phút, hai trong số đó rơi đúng lúc lượt #12 đang
          # chạy. Đẩy thẳng là mất trắng cả mẻ số liệu vừa lấy xong.
          #
          # `concurrency` bên trên chỉ chặn hai workflow chồng nhau, nó
          # không chặn được người. Nên ở đây phải tự nhường: đẩy hỏng thì
          # rebase lên bản mới rồi đẩy lại.
          #
          # Ba vòng chứ không phải một: đẩy lại cũng có thể bị chen tiếp,
          # và lượt #12 đã chứng minh một vòng là không đủ.
          #
          # `-X theirs` khi rebase: đụng thì lấy bản của LƯỢT NÀY. Nghe
          # liều, nhưng an toàn vì một lý do cụ thể — commit của bot chỉ
          # chứa đúng những đường dẫn trong `git add` bên trên, mà tất cả
          # đều là file SINH RA. Không có file viết tay nào lọt vào được,
          # nên không có bản viết tay nào để mà nuốt.
          #
          # Xấu nhất: người vừa commit tay một file sinh (CLAUDE.md dặn
          # đừng làm) thì bản đó bị bot đè. Nhưng lượt sau bot dựng lại
          # từ nguồn — trong đó có phần người vừa thêm — nên chậm nhất 6
          # giờ là tự đúng lại. Đổi lại, xưởng không đứng im chờ người gỡ.
          for lan in 1 2 3; do
            if out=$(git push 2>&1); then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$out"
            echo "::error::Vòng $lan · đẩy hỏng: $(printf '%s' "$out" | tr '\n' ' ' | tail -c 300)"
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            # `--autostash` vì lượt #14 còn ngã thêm một nhát nữa ở đây:
            #   error: cannot rebase: You have unstaged changes.
            # Các script build ghi ra vài file NGOÀI danh sách `git add`
            # bên trên — cố ý, đó là file ta không muốn commit — nhưng
            # rebase thì từ chối chạy khi cây làm việc còn bẩn, bất kể
            # bẩn ở chỗ nào. Autostash cất chúng đi rồi trả lại.
            if out=$(git rebase --autostash -X theirs origin/main 2>&1); then
              echo "Vòng $lan: đã rebase lên $(git rev-parse --short origin/main), đẩy lại."
              continue
            fi
            echo "$out"
            echo "::error::Vòng $lan · rebase hỏng: $(printf '%s' "$out" | tr '\n' ' ' | tail -c 300)"
            echo "::error::Đụng ở: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            git rebase --abort || true
            exit 1
          done
          echo "::error::Đẩy hỏng ba vòng liền — main đang bị ghi quá dày."
          exit 1

  # Bẫy của GitHub Actions: commit tạo bởi GITHUB_TOKEN KHÔNG kích hoạt
  # workflow khác (cơ chế chặn vòng lặp vô hạn). Nếu chỉ dựa vào `on: push`
  # của deploy-ipfs.yml thì số liệu cập nhật xong mà bản trên IPFS vẫn là bản cũ
  # mãi mãi. Nên phải gọi thẳng sang đây.
  # Chỉ đẩy lại Pages. CỐ Ý không pin lại cả site ở đây: bản site đo
  # ngày 14/08 là 21,8 MB / 462 file, nhân 4 lượt/ngày là đầy gói
  # Pinata free 1 GB trong khoảng hai tuần.
  #
  # Thứ đáng lưu vĩnh viễn là bản ĐÓNG DẤU SỐ LIỆU (1,8 KB) —
  # đã pin ở bước trên rồi. Site chỉ pin lại khi đóng dấu bằng tag.
  deploy-pages:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
