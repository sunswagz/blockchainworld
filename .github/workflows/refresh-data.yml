name: Cập nhật số liệu

# Chạy mỗi 6 giờ, lấy số mới rồi commit đè các file dữ liệu tự sinh:
#   · DefiLlama  → kinh-thanh/assets/js/data/live.js
#   · L2BEAT     → do-sat-vien/assets/js/data.js
#   · Công cụ    → cong-bo/assets/js/
#   · GitHub     → tang-thu-cac/assets/js/data.js
# Nhờ vậy app không cần server, và người dùng offline vẫn có số tương đối mới.
#
# Nếu thư mục kinh-thanh-app KHÔNG phải gốc repo, sửa `working-directory`
# bên dưới và đường dẫn trong bước commit thành ví dụ: kinh-thanh-app/...

on:
  schedule:
    # 17 phút sau các giờ 0, 6, 12, 18 (UTC).
    # Lệch 17 phút để tránh giờ tròn — lúc đó GitHub kẹt hàng đợi, chạy trễ cả tiếng.
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch: # cho phép bấm chạy tay trong tab Actions

# Workflow con KHÔNG được có quyền cao hơn workflow gọi nó — quyền khai
# ở đây là trần cho cả deploy-pages.yml bên dưới. Thiếu pages/id-token
# thì GitHub chặn ngay từ lúc khởi động (startup_failure), không có log
# nào trong job để mà lần ra.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 10 phút là quá chật kể từ khi Tàng Thư Các lên 66 kho. Bước đó
    # dao động rất mạnh (151s, 309s, rồi 532s) vì nó lùi giờ chờ mỗi
    # lần chạm hạn mức GitHub. Lần 14/08 07:52 job bị cắt đúng mốc
    # 10,3 phút — mà job bị cắt thì BƯỚC COMMIT KHÔNG CHẠY, nên cả
    # Kinh Thành lẫn Đô Sát Viện cũng mất luôn lượt cập nhật đó dù
    # chúng đã lấy số xong từ phút đầu.
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    # Cấp job, để `if` của step đọc được — khai trong chính step thì không.
    env:
      PINATA_JWT: ${{ secrets.PINATA_JWT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lấy số mới
        run: node scripts/build-live.mjs

      # Bảng xét Đô Sát Viện — nguồn khác (L2BEAT), file khác, hỏng độc lập.
      # Bước này ngã thì số liệu Kinh Thành ở trên vẫn commit được.
      - name: Lấy bảng xét L2BEAT
        continue-on-error: true
        run: node scripts/build-l2beat.mjs

      # Đồ nghề Công Bộ. Cũng continue-on-error, và vì lý do mạnh hơn:
      # kính lúp hồ sơ lấy từ fe-stag — host STAGING của L2BEAT, tắt
      # lúc nào không báo. Hỏng thì build tự giữ bản cũ.
      - name: Lấy đồ nghề Công Bộ
        continue-on-error: true
        run: node scripts/build-congbo.mjs

      # Kho skill Tàng Thư Các. GITHUB_TOKEN nâng hạn mức API GitHub
      # từ 60 lên 1.000 lượt/giờ mỗi repo — không có nó thì chỉ quét vài kho.
      # (Token cá nhân miễn phí thì được 5.000; ở đây 1.000 là quá đủ:
      #  quét 40 kho tốn khoảng 54 lượt.)
      #
      # Trần riêng cho bước này, thấp hơn trần job: chạm trần thì chỉ
      # mình nó ngã (continue-on-error nuốt), commit vẫn chạy. Không có
      # trần bước thì nó ăn hết ngân sách job và kéo cả lượt xuống.
      # Script chỉ ghi file ở cuối, nên bị cắt giữa chừng là file cũ
      # còn nguyên — không có bản dở dang nào bị commit.
      - name: Lấy kho skill Tàng Thư Các
        continue-on-error: true
        timeout-minutes: 14
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-tangthu.mjs

      # Đóng dấu bản số liệu lên IPFS trước khi commit.
      # Tự bỏ qua nếu sha256 trùng bản trước, nên không tạo rác.
      #
      # `if:` chỉ đỡ được trường hợp THIẾU secret. Secret CÓ mà sai thì
      # Pinata trả 4xx, pin-snapshot.mjs thoát 1, và trước khi có
      # continue-on-error thì cả job chết ngay tại đây — commit không
      # chạy, site đứng im. Đã xảy ra ba lượt liền 13–14/08, mỗi lượt
      # ngã trong chưa tới 1 giây, và cái mất không phải con dấu mà là
      # toàn bộ số liệu bốn cung đã lấy xong nằm chờ commit.
      #
      # Đóng dấu là thứ có thì tốt; số liệu mới là việc chính. Nó ngã
      # thì thoát trước khi ghi history.json, nên không để lại file dở.
      - name: Đóng dấu bản số liệu
        if: env.PINATA_JWT != ''
        continue-on-error: true
        run: node scripts/pin-snapshot.mjs

      - name: Commit nếu có thay đổi
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Liệt kê TỪNG đường dẫn, không add cả thư mục. Hai lý do, cả
          # hai đều đã cắn thật:
          #
          # 1. `cong-bo/assets/js/` gom cả file viết tay (halls.js, app.js,
          #    decoder.js, glossary.js, pwa.js) nằm chung thư mục với file
          #    bot sinh. Hook pre-commit đọc danh sách này để nhắc, nên nó
          #    báo nhầm mỗi lần ai đó sửa halls.js một cách hợp lệ — mà
          #    một cảnh báo báo nhầm mãi thì người ta bỏ qua cảnh báo.
          #
          # 2. Ngược lại, hai thư mục logo BỊ SÓT: build-l2beat.mjs và
          #    build-congbo.mjs tải ảnh về assets/logos/, còn add thì
          #    không phủ. Hệ quả im lặng: logos.js được commit và trỏ tới
          #    ảnh chưa bao giờ được commit → ảnh vỡ trên site. Chưa nổ
          #    vì lần thêm logo gần nhất là commit tay; sẽ nổ ngay lần
          #    L2BEAT thêm một dự án mới.
          #
          # Đổi ở đây thì cập nhật luôn mục "File do workflow tự sinh"
          # trong CLAUDE.md — `npm run kiem` bắt hai bên phải khớp.
          git add kinh-thanh/assets/js/data/live.js \
                  kinh-thanh/assets/js/data/provenance.js \
                  kinh-thanh/assets/data/history.json \
                  do-sat-vien/assets/js/data.js \
                  do-sat-vien/assets/logos/ \
                  cong-bo/assets/js/data.js \
                  cong-bo/assets/js/logos.js \
                  cong-bo/assets/js/v/nhat-ky.js \
                  cong-bo/assets/logos/ \
                  tang-thu-cac/assets/js/data.js \
                  tang-thu-cac/assets/data/
          if git diff --staged --quiet; then
            echo "Số liệu không đổi — không commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: cập nhật số liệu $(date -u +%d/%m/%Y' '%H:%M) UTC"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Bẫy của GitHub Actions: commit tạo bởi GITHUB_TOKEN KHÔNG kích hoạt
  # workflow khác (cơ chế chặn vòng lặp vô hạn). Nếu chỉ dựa vào `on: push`
  # của deploy-ipfs.yml thì số liệu cập nhật xong mà bản trên IPFS vẫn là bản cũ
  # mãi mãi. Nên phải gọi thẳng sang đây.
  # Chỉ đẩy lại Pages. CỐ Ý không pin lại cả site ở đây:
  # mỗi bản site ~440 KB, nhân 4 lần/ngày là 624 MB/năm — gói free
  # Pinata 1 GB sẽ đầy trong khoảng hai năm, đổi lấy 1.460 bản sao
  # gần như y hệt nhau mà không ai mở lại.
  #
  # Thứ đáng lưu vĩnh viễn là bản ĐÓNG DẤU SỐ LIỆU (1,8 KB) —
  # đã pin ở bước trên rồi. Site chỉ pin lại khi code đổi.
  deploy-pages:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
