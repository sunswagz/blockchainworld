name: GCI registry checks
on:
  push:
    branches: [main, feat/global-capital-intelligence]
    paths:
      - "global-capital-intelligence/**"
      - "scripts/check-gci.mjs"
      - ".github/workflows/check-gci.yml"
  pull_request:
    paths:
      - "global-capital-intelligence/**"
      - "scripts/check-gci.mjs"
      - ".github/workflows/check-gci.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Validate asset registry
        run: node scripts/check-gci.mjs
      - name: Validate JavaScript syntax
        run: node --check global-capital-intelligence/assets/js/app.js
      - name: Verify Pages packaging
        run: node scripts/build-dist.mjs
