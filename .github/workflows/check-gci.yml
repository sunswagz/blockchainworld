name: GCI registry checks
on:
  push:
    branches: [main, feat/global-capital-intelligence]
    paths:
      - "global-capital-intelligence/**"
      - "scripts/check-gci.mjs"
  pull_request:
    paths:
      - "global-capital-intelligence/**"
      - "scripts/check-gci.mjs"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: node scripts/check-gci.mjs
