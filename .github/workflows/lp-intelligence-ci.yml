name: LP Intelligence Foundation
# Offline deterministic checks only; no wallet credentials or transaction permissions.

on:
  pull_request:
    paths:
      - "thi-bac-ty-runtime/lp_intelligence/**"
      - "thi-bac-ty-runtime/scripts/kiem-lp-intelligence.py"
      - "thi-bac-ty-runtime/scripts/kiem-lp-collector-fixtures.py"
      - "thi-bac-ty-runtime/scripts/kiem-lp-fee-accounting.py"
      - ".github/workflows/lp-intelligence-ci.yml"
  push:
    branches: [main]
    paths:
      - "thi-bac-ty-runtime/lp_intelligence/**"
      - "thi-bac-ty-runtime/scripts/kiem-lp-intelligence.py"
      - "thi-bac-ty-runtime/scripts/kiem-lp-collector-fixtures.py"
      - "thi-bac-ty-runtime/scripts/kiem-lp-fee-accounting.py"
      - ".github/workflows/lp-intelligence-ci.yml"

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        working-directory: thi-bac-ty-runtime
        run: python -m pip install -r requirements.txt
      - name: Compile LP Intelligence
        working-directory: thi-bac-ty-runtime
        run: python -m compileall -q lp_intelligence scripts/kiem-lp-intelligence.py scripts/kiem-lp-collector-fixtures.py scripts/kiem-lp-fee-accounting.py
      - name: Run foundation self-test
        working-directory: thi-bac-ty-runtime
        run: python scripts/kiem-lp-intelligence.py
      - name: Run collector fixture tests
        working-directory: thi-bac-ty-runtime
        run: python scripts/kiem-lp-collector-fixtures.py
      - name: Run fee accounting fixture tests
        working-directory: thi-bac-ty-runtime
        run: python scripts/kiem-lp-fee-accounting.py
