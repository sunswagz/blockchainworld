name: Đưa lên GitHub Pages

# Nơi app thật sự CHẠY được ngay hôm nay: miễn phí, có HTTPS
# (bắt buộc cho service worker), cài lên điện thoại được.
#
# Phân vai:
#   GitHub Pages → chỗ người dùng mở app hằng ngày
#   IPFS/Pinata  → bản lưu bất biến + đóng dấu số liệu
#   ENS/Base     → nối sau, khi nào muốn trả phí
#
# Bật lần đầu: Settings → Pages → Source = GitHub Actions

on:
  push:
    branches: [main]
    # ── DANH SÁCH LOẠI TRỪ, KHÔNG PHẢI DANH SÁCH CHO PHÉP ──────────
    # Trước đây chỗ này liệt kê tay từng cung. Cách đó có một bẫy đã
    # cắn thật (commit 311e885): thêm cung mà quên thêm dòng thì push
    # thành công, KHÔNG workflow nào chạy, site vẫn bản cũ, và không
    # có gì báo. Im lặng hoàn toàn.
    #
    # Bẫy đó tệ dần theo số cung: mỗi cung mới là thêm một cơ hội quên,
    # ở hai file. Với một hoàng thành nhiều bộ nhiều ban thì đó là lỗi
    # chắc chắn xảy ra, chỉ là chưa biết lúc nào.
    #
    # Đảo lại thì hết bẫy: mặc định MỌI thứ đều deploy, chỉ trừ những
    # file rõ ràng không phải của trang. Cung mới tự kích hoạt vì
    # không ai phải nhớ thêm nó vào đâu cả.
    #
    # Cái giá: sửa mỗi README cũng dựng lại Pages. Một lượt dựng mất
    # khoảng một phút và miễn phí với repo công khai — rẻ hơn nhiều so
    # với một lần thay đổi không bao giờ lên site mà không ai hay.
    #
    # Đừng loại trừ `scripts/`: build-dist.mjs nằm trong đó và nó QUYẾT
    # ĐỊNH nội dung dist. Loại trừ cả thư mục là dựng lại đúng cái bẫy
    # vừa gỡ, chỉ đổi chỗ.
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"
      - ".github/**"
      - ".gitignore"
      - ".gitattributes"
      - "server.js"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Không huỷ giữa chừng: một lần deploy dở dang làm hỏng site đang chạy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # cùng bước đóng gói với IPFS — cùng byte, cùng kiểm tra
      - name: Đóng gói dist/
        run: node scripts/build-dist.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
