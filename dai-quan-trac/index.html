<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đài Quan Trắc · Dòng chảy địa chính trị</title>
<meta name="description" content="Năm chiến trường, mười một mắt xích, tám đồng hồ cảnh báo sớm — và đường truyền dẫn từ mỗi sự kiện tới kinh tế Việt Nam.">

<meta name="theme-color" content="#0a0c10">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quan Trắc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/app-shell.css">
<link rel="stylesheet" href="assets/css/halls.css">
</head>
<body>
<!-- WCAG 2.2 AA · 2.4.1 "Bypass Blocks" — trang này mở đầu bằng một
     thanh bên dài: hiệu, tới 54 mục phòng, rồi 12 mục cung. Người
     dùng bàn phím phải Tab qua trọn khối đó ở MỖI lần đổi phòng.
     Đường nhảy nấp cho tới khi được tiêu điểm — xem .bo-qua.

     href="#main" giữ đúng ngữ nghĩa cho trình đọc màn hình, nhưng
     onclick chặn lại: bộ định tuyến của cung này đọc THẲNG
     location.hash làm tên phòng ("#gauges", không gạch chéo), nên
     để hash thành "main" là nó đi tìm một phòng không có. Chuyển
     tiêu điểm bằng tay, hash giữ nguyên. -->
<a class="bo-qua" href="#main" onclick="return boQua()">Tới nội dung chính</a>
<div id="boot"></div>
<div id="scrim"></div>

<div id="app" class="">
  <!-- ================= NAV ================= -->
  <aside id="nav">
    <div class="brand">
      <div class="mark"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 2.6 15.2 0 18M12 3c-2.6 2.8-2.6 15.2 0 18"/></svg></div>
      <div class="brand-t"><b>ĐÀI QUAN TRẮC</b><span>Dòng chảy địa chính trị</span></div>
    </div>
    <div id="navscroll" class="scroll"></div>
    <div class="nav-foot">
      <button class="tinybtn" id="collapse">‹ Thu gọn</button>
      <button class="tinybtn" onclick="openCmd()">⌘K</button>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <main id="main" tabindex="-1">
    <div class="topbar">
      <button class="hamb" id="hamb" aria-label="Mở điều hướng"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <!-- chuyển chủ thể: app.js dựng, và ẨN HẲN khi chỉ có một nước -->
      <div class="chtbar" id="chtbar"></div>
      <div class="crumb">
        <h1 id="ttl">Dòng chảy</h1>
        <span class="sep lbl-hide">/</span>
        <span class="sub lbl-hide" id="sub">REALTIME</span>
      </div>
      <button class="tbtn lbl-hide" onclick="openCmd()"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg> <span class="kbd">⌘K</span></button>
      <button class="tbtn pri" id="scanAll"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg> Quét trực tiếp</button>
    </div>

    <div class="ticker">
      <div class="ticker-lab">MẠCH</div>
      <div class="ticker-run" id="tick"></div>
    </div>

    <div id="view" class="scroll"></div>
  </main>

  <!-- ================= RAIL ================= -->
  <aside id="rail">
    <div class="rail-h">
      <div class="t"><b id="rtitle">—</b><span id="rkind">HỒ SƠ</span></div>
      <button class="xbtn" onclick="closeRail()" aria-label="Đóng"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="railbody" class="scroll"></div>
  </aside>
</div>

<div id="cmdk">
  <div class="cmd">
    <input id="cmdin" placeholder="Đi tới mục, chiến trường, đồng hồ…" autocomplete="off" spellcheck="false">
    <div class="cmdlist scroll" id="cmdlist"></div>
    <div class="cmd-foot"><span>↑↓ chọn</span><span>↵ mở</span><span>esc đóng</span></div>
  </div>
</div>

<div id="toast"></div>

<!-- ═══ LỚP PHƯƠNG PHÁP — đứng TRÊN chỗ chia chủ thể ═══ -->
<!-- Thang bằng chứng + 7 tiêu chí. Dùng chung cho MỌI nước; nhờ vậy
     bảng chấm các nước so thẳng được với nhau. Nạp TRƯỚC mọi thứ. -->
<script src="assets/js/khung.js"></script>

<!-- ═══ CHỦ THỂ: VIỆT NAM ═══ -->
<!-- data.js = cú sốc từ NGOÀI vào · soi.js = bộ máy BÊN TRONG -->
<script src="assets/js/data.js"></script>
<script src="assets/js/soi.js"></script>

<!-- ═══ CHỦ THỂ: TRUNG QUỐC ═══ -->
<!-- KHÔNG phải bản sao Việt Nam đổi tên: mạch của Việt Nam kết thúc
     ở CPI và việc làm, mạch Trung Quốc kết thúc ở CHẾ ĐỘ CÓ SỐNG SÓT
     KHÔNG — nên nửa dưới của mạch khác hẳn. Xem đầu tq/data.js. -->
<script src="assets/js/tq/data.js"></script>
<script src="assets/js/tq/soi.js"></script>
<!-- Chủ thể thứ ba: khớp nối Việt–Trung. Không có do.js/scan.js vì
     nó không quan trắc gì cả — nó đọc hai bảng kia. -->
<script src="assets/js/tk/data.js"></script>
<!-- Bot ghi 2 lượt/ngày. 404 tới lượt đầu là bình thường; app đọc
     window.DQT_TIN qua `|| null` nên thiếu file thì mục tin tự rụng. -->
<script src="assets/js/tin.js"></script>
<!-- bản quét: TỰ SINH trên máy chủ mỗi 6 giờ, xem scripts/build-scan.mjs -->
<script src="assets/js/tq/scan.js" defer></script>
  <script src="assets/js/tq/do.js" defer></script>
  <script src="assets/js/scan.js"></script>
<!-- số đo bảng cảnh báo: TỰ SINH mỗi 6 giờ, KHÔNG gọi AI.
     Thiếu file này thì bảng lùi về chế độ đặt tay, không gãy —
     xem đầu scripts/build-quantrac.mjs. -->
<script src="assets/js/do.js"></script>
<!-- lớp tri thức nền · SINH TAY, xem knowledge-os/sinh.mjs -->
<script src="assets/js/v/tri-thuc.js"></script>
<!-- giao diện -->
<script src="assets/js/app.js"></script>
<!-- Mười sáu hàm vẽ, tách khỏi app.js vì vỏ ứng dụng tăng ~30 KB mỗi
     tuần và ngưỡng phiếu đo là 200 KB. Nạp SAU app.js: app.js khởi
     động bất đồng bộ nên tới lúc nó vẽ thì bốn tệp này đã nạp xong. -->
<script src="assets/js/trang/dong.js"></script>
<script src="assets/js/trang/bang.js"></script>
<script src="assets/js/trang/soi.js"></script>
<script src="assets/js/trang/nen.js"></script>
<!-- vỏ ứng dụng -->
<script src="assets/js/halls.js"></script>
<script>if(typeof navigator!=='undefined'){var s=document.createElement('script');s.src='assets/js/pwa.js';document.body.appendChild(s);}</script>
</body>
</html>
