     gì không" phải nằm TRƯỚC mọi thứ khác, và phải đọc được trong hai giây. -->
<header class="dinh">
  <a class="hieu" href="/" data-lien>
    <span class="dau" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
        <path d="M3 18h18M5 18V9l7-4 7 4v9"/><path d="M9 18v-5h6v5"/><path d="M2 21h20"/>
      </svg>
    </span>
    <span class="hieu-chu">
      <b>Thị Bạc Ty</b>
      <i>bộ máy quản lý vốn</i>
    </span>
  </a>

  <div class="song" id="song">
    <span class="den" id="den-chay"><i></i><b>—</b></span>
    <span class="so-nho">vòng <b id="d-vong">—</b></span>
    <span class="so-nho">quét <b id="d-quet">—</b></span>
    <span class="so-nho">chạy <b id="d-len">—</b></span>
    <span class="hanh-dong">
      <button id="nut-quet" type="button" title="Quét lại ngay">↻ Quét lại</button>
      <button id="nut-dung" type="button" title="Tạm dừng / chạy tiếp">⏸ Dừng</button>
      <details class="them">
        <summary title="Việc ít dùng">⋯</summary>
        <div class="menu">
          <button id="nut-doi-soat" type="button">Đối soát vị thế</button>
          <button id="nut-lat" type="button">Ghi lát cắt ra cung tĩnh</button>
        </div>
      </details>
    </span>
  </div>
</header>
